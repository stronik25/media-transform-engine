name: Contract audit (live-dev)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID that produced artifact live-dev"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for audit script)
        uses: actions/checkout@v4

      - name: Download live-dev artifact by run_id
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          path: audit/live-dev
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify contract + digest
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/live_dev_digest.sh
          tools/live_dev_digest.sh audit/live-dev
