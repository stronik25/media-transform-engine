name: AI Debug (3 agents: ARCH -> DEV -> QA)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to use as task"
        required: true
        type: string
      dry_run:
        description: "Dry-run (no API calls)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: ai-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  OUTPUT_DIR: output

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.resolve.outputs.issue_num }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ISSUE_NUM + DRY_RUN
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_NUM=""
          DRY_RUN="true"

          # If manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUM="${{ inputs.issue }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            # issues event
            ISSUE_NUM="${{ github.event.issue.number }}"
            # enable dry_run unless label "run-live" exists
            DRY_RUN="true"
          fi

          if [ -z "${ISSUE_NUM}" ]; then
            echo "ISSUE_NUM is empty" >&2
            exit 1
          fi

          echo "issue_num=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

      - name: Validate repo structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ".ai/contract.md"

      - name: Validate secrets/vars presence (dry-run skips API requirements)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.resolve.outputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true -> skipping API secret checks"
            exit 0
          fi

          # Live mode requires LLM_API_KEY (or OPENAI_API_KEY fallback)
          if [ -z "${{ secrets.LLM_API_KEY }}" ] && [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Missing secret: LLM_API_KEY (or OPENAI_API_KEY)" >&2
            exit 1
          fi

  arch:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

      - name: ARCH (dry-run)
        if: needs.preflight.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > "${OUTPUT_DIR}/arch_plan.md" <<EOF
# ARCH PLAN (DRY-RUN)

Issue: #${{ needs.preflight.outputs.issue_num }}

- Repo structure: OK
- Next: DEV stage would propose a patch
- Then: QA would verify expected outputs
EOF

      - name: ARCH (live)
        if: needs.preflight.outputs.dry_run != 'true'
        shell: bash
        env:
          ISSUE_NUM: ${{ needs.preflight.outputs.issue_num }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          echo "LIVE mode not wired yet (intentional)."
          exit 1

      - name: Upload arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-out
          path: output/arch_plan.md

  dev:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

      - name: Download arch artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-out
          path: output

      - name: DEV (dry-run)
        shell: bash
        run: |
          set -euo pipefail
          test -f output/arch_plan.md
          cat > "${OUTPUT_DIR}/dev_patch.md" <<EOF
# DEV PATCH (DRY-RUN)

Would implement the ARCH plan for issue #${{ github.run_id }}.

(No code changes in dry-run.)
EOF

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-out
          path: output/dev_patch.md

  qa:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

      - name: Download dev artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-out
          path: output

      - name: QA (dry-run)
        shell: bash
        run: |
          set -euo pipefail
          test -f output/dev_patch.md
          cat > "${OUTPUT_DIR}/qa_report.md" <<EOF
# QA REPORT (DRY-RUN)

Checks:
- arch artifact exists: OK
- dev artifact exists: OK
- contract exists: OK

Result: PASS
EOF

      - name: Upload qa artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: output/qa_report.md
