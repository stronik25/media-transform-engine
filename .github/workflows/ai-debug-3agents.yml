name: AI Debug (3 agents: ARCH → DEV → QA)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (optional)"
        required: false
        default: ""

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repo structure (safe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai ci output || true

      - name: Validate secrets / vars presence
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::OPENAI_API_KEY is missing"
            missing=1
          fi

          for v in ARCH_MODEL DEV_MODEL QA_MODEL LLM_ENDPOINT; do
            if [ -z "${{ vars[format('{0}', v)] }}" ]; then
              echo "::error::$v variable is missing"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

  arch:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build ARCH prompt
        shell: bash
        run: |
          set -euo pipefail
          echo "You are ARCH agent. Analyze the issue and produce a plan." > output/arch_prompt.txt

      - name: Call ARCH model
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.ARCH_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "ARCH OK" > output/arch_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arch-output
          path: output/

  dev:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arch-output
          path: output/

      - name: Build DEV prompt
        shell: bash
        run: |
          set -euo pipefail
          echo "You are DEV agent. Implement based on ARCH." > output/dev_prompt.txt

      - name: Call DEV model
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.DEV_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "DEV OK" > output/dev_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dev-output
          path: output/

  qa:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dev-output
          path: output/

      - name: Build QA prompt (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "You are QA agent. Review implementation." > output/qa_prompt.txt

      - name: Call QA model
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.QA_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "QA OK" > output/qa_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qa-output
          path: output/
