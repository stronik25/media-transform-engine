name: "AI Debug (v2: issue -> artifacts)"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        default: "1"

permissions:
  contents: read
  issues: read

env:
  OUTPUT_DIR: output

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.vars.outputs.issue_num }}
    steps:
      - name: "Resolve ISSUE_NUM"
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "issue_num=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Prepare output dirs"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

      - name: "Fetch issue context (title/body/comments)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ steps.vars.outputs.issue_num }}
        run: |
          set -euo pipefail

          # Title + body
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE" \
            > "${OUTPUT_DIR}/issue.json"

          # Comments (may be empty)
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE/comments?per_page=100" \
            > "${OUTPUT_DIR}/comments.json"

      - name: "Build context markdown"
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# AI Debug Context"
            echo
            echo "Issue: #${{ steps.vars.outputs.issue_num }}"
            echo "Repo: ${{ github.repository }}"
            echo "Run: ${{ github.run_id }}"
            echo "SHA: ${{ github.sha }}"
            echo
            echo "## Files"
            echo "- output/issue.json"
            echo "- output/comments.json"
          } > "${OUTPUT_DIR}/context.md"

      - name: "Upload context artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-context
          path: ${{ env.OUTPUT_DIR }}

  arch:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output

      - name: "ARCH placeholder (reads context)"
        shell: bash
        run: |
          set -euo pipefail
          echo "ARCH stage placeholder"
          ls -la output
          echo "---- context.md ----"
          sed -n '1,120p' output/context.md

      - name: "Upload ARCH artifact"
        uses: actions/upload-artifact@v4
        with:
          name: arch-out
          path: output

  dev:
    runs-on: ubuntu-latest
    needs: arch
    steps:
      - name: "Download ARCH artifact"
        uses: actions/download-artifact@v4
        with:
          name: arch-out
          path: output

      - name: "DEV placeholder"
        shell: bash
        run: |
          set -euo pipefail
          echo "DEV stage placeholder"
          ls -la output

      - name: "Upload DEV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: dev-out
          path: output

  qa:
    runs-on: ubuntu-latest
    needs: dev
    steps:
      - name: "Download DEV artifact"
        uses: actions/download-artifact@v4
        with:
          name: dev-out
          path: output

      - name: "QA placeholder"
        shell: bash
        run: |
          set -euo pipefail
          echo "QA stage placeholder"
          ls -la output

      - name: "Upload QA artifact"
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: output
