name: AI Debug (3 agents: ARCH → DEV → QA)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode (no API calls, no secrets needed)"
        required: true
        type: boolean
        default: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repo structure (safe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai ci output || true

      - name: Validate vars / secrets presence (skipped in dry-run)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::OPENAI_API_KEY is missing"
            missing=1
          fi

          for v in ARCH_MODEL DEV_MODEL QA_MODEL LLM_ENDPOINT; do
            if [ -z "${{ vars[format('{0}', v)] }}" ]; then
              echo "::error::$v variable is missing"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

  arch:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build ARCH prompt
        shell: bash
        run: |
          set -euo pipefail
          echo "You are ARCH agent. Analyze the issue and produce a plan." > output/arch_prompt.txt
          echo "issue=${{ inputs.issue }}" >> output/arch_prompt.txt
          echo "dry_run=${{ inputs.dry_run }}" >> output/arch_prompt.txt

      - name: DRY-RUN: create placeholder ARCH result (no API)
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/arch_result.txt <<'EOF'
DRY-RUN MODE
- No API calls were made.
- This is a placeholder ARCH plan.
Next: DEV will simulate applying changes.
EOF

      - name: Call ARCH model (real)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.ARCH_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "ARCH REAL MODE would call: $ENDPOINT with model=$MODEL" > output/arch_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arch-output
          path: output/

  dev:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arch-output
          path: output/

      - name: Build DEV prompt
        shell: bash
        run: |
          set -euo pipefail
          echo "You are DEV agent. Implement based on ARCH." > output/dev_prompt.txt
          echo "dry_run=${{ inputs.dry_run }}" >> output/dev_prompt.txt
          echo "" >> output/dev_prompt.txt
          echo "ARCH_RESULT:" >> output/dev_prompt.txt
          cat output/arch_result.txt >> output/dev_prompt.txt

      - name: DRY-RUN: create placeholder DEV result (no API, no git)
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/dev_result.txt <<'EOF'
DRY-RUN MODE
- No API calls were made.
- No repository files were modified.
- This is a placeholder DEV changeset.
EOF

      - name: Call DEV model (real)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.DEV_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "DEV REAL MODE would call: $ENDPOINT with model=$MODEL" > output/dev_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dev-output
          path: output/

  qa:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dev-output
          path: output/

      - name: Build QA prompt (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "You are QA agent. Review implementation." > output/qa_prompt.txt
          echo "dry_run=${{ inputs.dry_run }}" >> output/qa_prompt.txt
          echo "" >> output/qa_prompt.txt
          echo "DEV_RESULT:" >> output/qa_prompt.txt
          cat output/dev_result.txt >> output/qa_prompt.txt

      - name: DRY-RUN: create placeholder QA report (no API)
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/qa_report.txt <<'EOF'
DRY-RUN MODE
Verdict: PASS (simulated)
Notes:
- No API calls were made.
- No code changes were reviewed (simulation only).
EOF

      - name: Call QA model (real)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.QA_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "QA REAL MODE would call: $ENDPOINT with model=$MODEL" > output/qa_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qa-output
          path: output/
