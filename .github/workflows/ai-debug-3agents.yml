name: "AI Debug (v5 gates; v4 deterministic default)"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        default: "1"
      run_live:
        description: "Enable LIVE mode (OpenAI). Default false. Requires LIVE_ENABLED=true and valid config."
        required: true
        type: boolean
        default: false
      apply_live:
        description: "Apply LIVE DEV output into repo (creates branch+PR). Default false."
        required: true
        type: boolean
        default: false
      live_max_usd:
        description: "LIVE budget cap in USD (fail-fast)."
        required: true
        default: "0.50"
      live_max_input_tokens:
        description: "LIVE total input token cap estimate (fail-fast)."
        required: true
        default: "12000"
      live_max_output_tokens:
        description: "LIVE per-call output token cap (fail-fast)."
        required: true
        default: "1200"
      live_fail_on_cap:
        description: "If true, preflight fails when estimates exceed caps."
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

env:
  OUTPUT_DIR: "output"
  BRANCH_PREFIX: "ai-debug/issue-"
  LIVE_CONFIG_PATH: ".ai/openai.config.json"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.vars.outputs.issue_num }}
      branch_name: ${{ steps.vars.outputs.branch_name }}
      run_live_requested: ${{ steps.live_gate.outputs.run_live_requested }}
      live_enabled_var: ${{ steps.live_gate.outputs.live_enabled_var }}
      run_live_effective: ${{ steps.live_gate.outputs.run_live_effective }}
      apply_live_requested: ${{ steps.live_gate.outputs.apply_live_requested }}
      preflight_note: ${{ steps.live_gate.outputs.preflight_note }}
    steps:
      - name: "Resolve ISSUE_NUM + branch"
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ inputs.issue }}"
          echo "issue_num=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "branch_name=${{ env.BRANCH_PREFIX }}$ISSUE" >> "$GITHUB_OUTPUT"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Validate repo structure"
        shell: bash
        run: |
          set -euo pipefail
          test -f ".ai/contract.md"

      - name: "Prepare output dirs"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}/context"
          mkdir -p "${OUTPUT_DIR}/preflight"

      - name: "Validate v5 inputs (strict parsing)"
        shell: bash
        run: |
          set -euo pipefail

          # numeric inputs arrive as strings
          MAX_USD="${{ inputs.live_max_usd }}"
          MAX_IN="${{ inputs.live_max_input_tokens }}"
          MAX_OUT="${{ inputs.live_max_output_tokens }}"

          python3 - <<'PY'
          import os, sys
          def die(msg): print(msg, file=sys.stderr); sys.exit(2)

          def as_float(s, name):
            try:
              v=float(s)
            except Exception:
              die(f"{name} must be a number, got: {s!r}")
            if v<=0: die(f"{name} must be > 0, got: {v}")
            return v

          def as_int(s, name):
            try:
              v=int(str(s).strip())
            except Exception:
              die(f"{name} must be an int, got: {s!r}")
            if v<=0: die(f"{name} must be > 0, got: {v}")
            return v

          as_float(os.environ["MAX_USD"], "live_max_usd")
          as_int(os.environ["MAX_IN"], "live_max_input_tokens")
          as_int(os.environ["MAX_OUT"], "live_max_output_tokens")
          print("OK: v5 numeric inputs valid")
          PY
        env:
          MAX_USD: ${{ inputs.live_max_usd }}
          MAX_IN: ${{ inputs.live_max_input_tokens }}
          MAX_OUT: ${{ inputs.live_max_output_tokens }}

      - name: "Fetch issue context (title/body/comments)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ steps.vars.outputs.issue_num }}
        run: |
          set -euo pipefail

          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE" \
            > "${OUTPUT_DIR}/context/issue.json"

          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE/comments?per_page=100" \
            > "${OUTPUT_DIR}/context/comments.json"

      - name: "Snapshot OpenAI config into preflight artifact (if present)"
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ env.LIVE_CONFIG_PATH }}" ]; then
            cp "${{ env.LIVE_CONFIG_PATH }}" "${OUTPUT_DIR}/preflight/openai.config.json"
          fi

      - name: "LIVE gate + budget preflight (no OpenAI calls)"
        id: live_gate
        shell: bash
        env:
          LIVE_ENABLED_VAR: ${{ vars.LIVE_ENABLED }}
          RUN_LIVE_INPUT: ${{ inputs.run_live }}
          APPLY_LIVE_INPUT: ${{ inputs.apply_live }}
          MAX_USD: ${{ inputs.live_max_usd }}
          MAX_IN: ${{ inputs.live_max_input_tokens }}
          MAX_OUT: ${{ inputs.live_max_output_tokens }}
          FAIL_ON_CAP: ${{ inputs.live_fail_on_cap }}
        run: |
          set -euo pipefail

          # Normalize booleans strictly to "true"/"false"
          norm_bool () {
            v="$(printf "%s" "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            if [ "$v" = "true" ]; then echo "true"; else echo "false"; fi
          }

          RUN_LIVE="$(norm_bool "${RUN_LIVE_INPUT}")"
          APPLY_LIVE="$(norm_bool "${APPLY_LIVE_INPUT}")"
          LIVE_ENABLED="$(norm_bool "${LIVE_ENABLED_VAR}")"

          # Default
          EFFECTIVE="false"
          NOTE=""

          if [ "$RUN_LIVE" != "true" ]; then
            NOTE="LIVE not requested (run_live=false)."
            EFFECTIVE="false"
          else
            if [ "$LIVE_ENABLED" != "true" ]; then
              NOTE="LIVE requested but LIVE_ENABLED!=true (repo variable)."
              EFFECTIVE="false"
            else
              # LIVE requested+enabled: require config file
              CFG="${OUTPUT_DIR}/preflight/openai.config.json"
              if [ ! -f "$CFG" ]; then
                echo "LIVE enabled but missing config snapshot: $CFG" >&2
                echo "Expected repo file at: ${{ env.LIVE_CONFIG_PATH }}" >&2
                exit 3
              fi

              # Validate config + enforce caps (fail-fast) WITHOUT any API calls.
              python3 - <<'PY'
              import json, os, sys, math

              def die(msg, code=4):
                print(msg, file=sys.stderr)
                sys.exit(code)

              cfg_path = os.path.join(os.environ["OUTPUT_DIR"], "preflight", "openai.config.json")
              with open(cfg_path, "r", encoding="utf-8") as f:
                cfg = json.load(f)

              if not isinstance(cfg, dict):
                die("Config must be a JSON object")

              roles = cfg.get("roles")
              if not isinstance(roles, dict):
                die("Config missing top-level key: roles")

              required_roles = ("arch","dev","qa")
              required_keys  = ("model","price_in_per_1k","price_out_per_1k","max_output_tokens")

              for r in required_roles:
                if r not in roles or not isinstance(roles[r], dict):
                  die(f"Config missing role: {r}")
                for k in required_keys:
                  if k not in roles[r]:
                    die(f"Config missing key for role '{r}': {k}")

              # caps
              max_usd = float(os.environ["MAX_USD"])
              max_in  = int(os.environ["MAX_IN"])
              max_out = int(os.environ["MAX_OUT"])
              fail_on_cap = (str(os.environ["FAIL_ON_CAP"]).strip().lower() == "true")

              # conservative worst-case estimate:
              #  - total input tokens: max_in (for the whole run)
              #  - output tokens: 3 calls * max_out
              #  - cost: sum over roles by their prices (worst-case: each role could see all input and produce max_out)
              total_out = 3 * max_out

              est_usd = 0.0
              for r in required_roles:
                pin  = float(roles[r]["price_in_per_1k"])
                pout = float(roles[r]["price_out_per_1k"])
                est_usd += (max_in/1000.0)*pin + (max_out/1000.0)*pout

              # Store preflight report
              rep = []
              rep.append(f"run_live_requested=true")
              rep.append(f"live_enabled_var=true")
              rep.append(f"max_usd={max_usd}")
              rep.append(f"max_input_tokens={max_in}")
              rep.append(f"max_output_tokens_per_call={max_out}")
              rep.append(f"estimated_usd_conservative={est_usd:.6f}")
              rep.append(f"estimated_total_output_tokens={total_out}")

              rep_path = os.path.join(os.environ["OUTPUT_DIR"], "preflight", "report.txt")
              with open(rep_path, "w", encoding="utf-8") as f:
                f.write("\n".join(rep) + "\n")

              # enforce caps
              if max_in > int(os.environ["MAX_IN"]):
                die("Internal cap error: max_in parsing mismatch")

              if est_usd > max_usd:
                msg = f"Estimated USD {est_usd:.6f} exceeds cap {max_usd:.6f}"
                if fail_on_cap:
                  die(msg, code=5)
                else:
                  print("WARN:", msg, file=sys.stderr)

              # If here -> OK
              print("OK: LIVE config validated and caps checked (no API calls).")
              PY
              export OUTPUT_DIR="${OUTPUT_DIR}"

              NOTE="LIVE enabled and preflight OK."
              EFFECTIVE="true"
            fi
          fi

          echo "run_live_requested=$RUN_LIVE" >> "$GITHUB_OUTPUT"
          echo "apply_live_requested=$APPLY_LIVE" >> "$GITHUB_OUTPUT"
          echo "live_enabled_var=$LIVE_ENABLED" >> "$GITHUB_OUTPUT"
          echo "run_live_effective=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "preflight_note=$NOTE" >> "$GITHUB_OUTPUT"

          # Human-readable summary always
          {
            echo "run_live_requested=$RUN_LIVE"
            echo "live_enabled_var=$LIVE_ENABLED"
            echo "run_live_effective=$EFFECTIVE"
            echo "apply_live_requested=$APPLY_LIVE"
            echo "note=$NOTE"
          } >> "${OUTPUT_DIR}/preflight/summary.txt"

      - name: "Upload context artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-context
          path: ${{ env.OUTPUT_DIR }}/context

      - name: "Upload preflight report artifact"
        uses: actions/upload-artifact@v4
        with:
          name: preflight-out
          path: ${{ env.OUTPUT_DIR }}/preflight

  dev:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install jq"
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Generate deterministic patch from issue.json"
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ needs.preflight.outputs.issue_num }}"
          mkdir -p .ai/dev

          TITLE="$(jq -r '.title // ""' output/context/issue.json)"
          BODY="$(jq -r '.body // ""' output/context/issue.json)"
          URL="$(jq -r '.html_url // ""' output/context/issue.json)"
          USER="$(jq -r '.user.login // ""' output/context/issue.json)"
          CREATED="$(jq -r '.created_at // ""' output/context/issue.json)"

          OUT=".ai/dev/issue_${ISSUE_NUM}.md"
          : > "$OUT"
          printf "# Issue %s\n\n" "$ISSUE_NUM" >> "$OUT"
          printf "URL: %s\n\n" "$URL" >> "$OUT"
          printf "Author: %s\n" "$USER" >> "$OUT"
          printf "Created: %s\n\n" "$CREATED" >> "$OUT"
          printf "## Title\n%s\n\n" "$TITLE" >> "$OUT"
          printf "## Body\n%s\n" "$BODY" >> "$OUT"

      - name: "Commit to branch"
        shell: bash
        run: |
          set -euo pipefail
          BR="${{ needs.preflight.outputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add .ai/dev
          git commit -m "ai-debug: add deterministic summary for issue #${{ needs.preflight.outputs.issue_num }}" || true
          git push -u origin "$BR" --force

      - name: "Create/Update PR"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${{ needs.preflight.outputs.branch_name }}"
          TITLE="ai-debug: issue #${{ needs.preflight.outputs.issue_num }}"
          BODY="Deterministic patch generated from issue.json (no LLM)."
          gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY" 2>/dev/null || \
          gh pr edit "$BR" --title "$TITLE" --body "$BODY"

      - name: "Upload DEV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: dev-out
          path: .ai/dev

  qa:
    runs-on: ubuntu-latest
    needs: dev
    steps:
      - name: "Download DEV artifact"
        uses: actions/download-artifact@v4
        with:
          name: dev-out
          path: qa_artifacts

      - name: "QA checks"
        shell: bash
        run: |
          set -euo pipefail
          ls -la qa_artifacts
          test "$(find qa_artifacts -maxdepth 1 -type f -name 'issue_*.md' | wc -l)" -ge 1
          echo "QA OK: issue summary exists"

  arch_live:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.run_live_effective == 'true' }}
    steps:
      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Download preflight artifact"
        uses: actions/download-artifact@v4
        with:
          name: preflight-out
          path: output/preflight

      - name: "ARCH (OpenAI) -> response.json"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          test -f output/preflight/openai.config.json
          test -f output/context/issue.json

          python3 - <<'PY'
          import json, os, sys, textwrap, time

          def die(msg, code=10):
            print(msg, file=sys.stderr)
            sys.exit(code)

          key = os.environ.get("OPENAI_API_KEY","")
          if not key:
            die("Missing OPENAI_API_KEY secret")

          with open("output/preflight/openai.config.json","r",encoding="utf-8") as f:
            cfg = json.load(f)

          role = cfg["roles"]["arch"]
          model = role["model"]
          max_out = int(os.environ.get("LIVE_MAX_OUT","1200"))

          with open("output/context/issue.json","r",encoding="utf-8") as f:
            issue = json.load(f)

          title = issue.get("title","")
          body = issue.get("body","") or ""
          url = issue.get("html_url","")

          prompt = (
            "You are ARCH. Produce a short plan for DEV.\n"
            f"URL: {url}\n"
            f"Title: {title}\n"
            f"Body:\n{body}\n"
            "\nReturn JSON with keys: goals, risks, dev_tasks (array of strings), qa_checks (array of strings).\n"
          )

          payload = {
            "model": model,
            "input": [
              {
                "role": "user",
                "content": [
                  {"type":"input_text","text": prompt}
                ]
              }
            ],
            "max_output_tokens": max_out
          }

          os.makedirs("output/live/arch", exist_ok=True)
          with open("output/live/arch/request.json","w",encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=True, indent=2)

          PY
        env:
          LIVE_MAX_OUT: ${{ inputs.live_max_output_tokens }}

      - name: "Call OpenAI Responses API (ARCH)"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -f output/live/arch/request.json

          curl -sS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @output/live/arch/request.json \
            > output/live/arch/response.json

          test -s output/live/arch/response.json

      - name: "Upload LIVE ARCH artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-arch
          path: output/live/arch

  dev_live:
    runs-on: ubuntu-latest
    needs: [preflight, arch_live]
    if: ${{ needs.preflight.outputs.run_live_effective == 'true' }}
    steps:
      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Download preflight artifact"
        uses: actions/download-artifact@v4
        with:
          name: preflight-out
          path: output/preflight

      - name: "Download LIVE ARCH artifact"
        uses: actions/download-artifact@v4
        with:
          name: live-arch
          path: output/live/arch

      - name: "DEV (OpenAI) -> issue_<N>.md"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          test -f output/preflight/openai.config.json
          test -f output/context/issue.json
          test -f output/live/arch/response.json

          python3 - <<'PY'
          import json, os, sys

          def die(msg, code=11):
            print(msg, file=sys.stderr); sys.exit(code)

          if not os.environ.get("OPENAI_API_KEY",""):
            die("Missing OPENAI_API_KEY secret")

          with open("output/preflight/openai.config.json","r",encoding="utf-8") as f:
            cfg = json.load(f)

          role = cfg["roles"]["dev"]
          model = role["model"]
          max_out = int(os.environ.get("LIVE_MAX_OUT","1200"))

          with open("output/context/issue.json","r",encoding="utf-8") as f:
            issue = json.load(f)

          with open("output/live/arch/response.json","r",encoding="utf-8") as f:
            arch_resp = json.load(f)

          title = issue.get("title","")
          body = issue.get("body","") or ""
          url = issue.get("html_url","")

          prompt = (
            "You are DEV. Create a deterministic markdown summary file for .ai/dev.\n"
            "Use ARCH output as guidance.\n"
            "Return plain markdown.\n\n"
            f"URL: {url}\nTitle: {title}\n\nBody:\n{body}\n\n"
            f"ARCH_RESPONSE_JSON:\n{json.dumps(arch_resp, ensure_ascii=True)}\n"
          )

          payload = {
            "model": model,
            "input": [
              {
                "role": "user",
                "content": [
                  {"type":"input_text","text": prompt}
                ]
              }
            ],
            "max_output_tokens": max_out
          }

          os.makedirs("output/live/dev", exist_ok=True)
          with open("output/live/dev/request.json","w",encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=True, indent=2)
          PY
        env:
          LIVE_MAX_OUT: ${{ inputs.live_max_output_tokens }}

      - name: "Call OpenAI Responses API (DEV)"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -f output/live/dev/request.json

          curl -sS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @output/live/dev/request.json \
            > output/live/dev/response.json

          test -s output/live/dev/response.json

      - name: "Extract markdown to issue_<N>.md"
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ needs.preflight.outputs.issue_num }}"
          python3 - <<'PY'
          import json, sys, os

          issue_num = os.environ["ISSUE_NUM"]
          with open("output/live/dev/response.json","r",encoding="utf-8") as f:
            resp = json.load(f)

          # Try common response shapes; fall back to whole JSON
          md = None

          # Newer "responses" API often has output array with content items
          out = resp.get("output")
          if isinstance(out, list):
            texts = []
            for item in out:
              content = item.get("content")
              if isinstance(content, list):
                for c in content:
                  if c.get("type") in ("output_text","text") and isinstance(c.get("text"), str):
                    texts.append(c["text"])
            if texts:
              md = "\n".join(texts).strip()

          if not md:
            md = json.dumps(resp, ensure_ascii=False, indent=2)

          os.makedirs("output/live/dev", exist_ok=True)
          path = f"output/live/dev/issue_{issue_num}.md"
          with open(path, "w", encoding="utf-8") as f:
            f.write(md + "\n")
          print("Wrote", path)
          PY
        env:
          ISSUE_NUM: ${{ needs.preflight.outputs.issue_num }}

      - name: "Upload LIVE DEV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-dev
          path: output/live/dev

  qa_live:
    runs-on: ubuntu-latest
    needs: [preflight, dev_live]
    if: ${{ needs.preflight.outputs.run_live_effective == 'true' }}
    steps:
      - name: "Download LIVE DEV artifact"
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          path: qa_live_artifacts

      - name: "QA LIVE checks (artifacts-only)"
        shell: bash
        run: |
          set -euo pipefail
          ls -la qa_live_artifacts
          test "$(find qa_live_artifacts -maxdepth 1 -type f -name 'issue_*.md' | wc -l)" -ge 1
          echo "QA LIVE OK: issue markdown exists"

      - name: "Upload LIVE QA artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-qa
          path: qa_live_artifacts

  apply_live_dev:
    runs-on: ubuntu-latest
    needs: [preflight, qa_live]
    if: ${{ needs.preflight.outputs.run_live_effective == 'true' && needs.preflight.outputs.apply_live_requested == 'true' }}
    steps:
      - name: "This job is intentionally gated"
        shell: bash
        run: |
          set -euo pipefail
          echo "apply_live_dev is enabled only when apply_live=true. Prefer manual apply workflow for production."
