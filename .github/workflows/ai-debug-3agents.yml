name: "AI Debug (v5 gates; v4 deterministic default)"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        default: "1"
      run_live:
        description: "Enable LIVE mode (OpenAI). Default false. Requires LIVE_ENABLED=true and valid config."
        required: false
        default: "false"
      max_usd:
        description: "LIVE budget cap in USD (fail-fast)."
        required: false
        default: "0.50"
      max_input_tokens:
        description: "LIVE total input token cap estimate (fail-fast)."
        required: false
        default: "12000"
      max_output_tokens_per_call:
        description: "LIVE per-call output token cap (fail-fast)."
        required: false
        default: "1200"
      fail_on_budget_exceed:
        description: "If true, preflight fails when estimates exceed caps."
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write
  issues: read

env:
  OUTPUT_DIR: output
  BRANCH_PREFIX: ai-debug/issue-

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.vars.outputs.issue_num }}
      branch_name: ${{ steps.vars.outputs.branch_name }}
      run_live_effective: ${{ steps.live_gate.outputs.run_live_effective }}
    steps:
      - name: "Resolve ISSUE_NUM + branch"
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ inputs.issue }}"
          echo "issue_num=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "branch_name=${{ env.BRANCH_PREFIX }}$ISSUE" >> "$GITHUB_OUTPUT"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Validate repo structure"
        shell: bash
        run: |
          set -euo pipefail
          test -f ".ai/contract.md"
          test -f ".ai/scripts/live_preflight.py"
          test -f ".ai/scripts/openai_call.py"
          test -f ".ai/scripts/read_role_config.py"

      - name: "Prepare output dirs"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}/context" "${OUTPUT_DIR}/preflight"

      - name: "Validate v5 inputs (strict parsing)"
        shell: bash
        run: |
          set -euo pipefail

          is_int() { [[ "$1" =~ ^[0-9]+$ ]]; }
          is_bool() { [[ "$1" == "true" || "$1" == "false" ]]; }
          is_money() { [[ "$1" =~ ^[0-9]+(\.[0-9]{1,4})?$ ]]; }

          RUN_LIVE="${{ inputs.run_live }}"
          MAX_USD="${{ inputs.max_usd }}"
          MAX_IN_TOK="${{ inputs.max_input_tokens }}"
          MAX_OUT_TOK="${{ inputs.max_output_tokens_per_call }}"
          FAIL_ON="${{ inputs.fail_on_budget_exceed }}"

          if ! is_bool "$RUN_LIVE"; then
            echo "Invalid input run_live=$RUN_LIVE (must be true/false)" >&2
            exit 2
          fi
          if ! is_money "$MAX_USD"; then
            echo "Invalid input max_usd=$MAX_USD (must be numeric like 0.50)" >&2
            exit 2
          fi
          if ! is_int "$MAX_IN_TOK"; then
            echo "Invalid input max_input_tokens=$MAX_IN_TOK (must be integer)" >&2
            exit 2
          fi
          if ! is_int "$MAX_OUT_TOK"; then
            echo "Invalid input max_output_tokens_per_call=$MAX_OUT_TOK (must be integer)" >&2
            exit 2
          fi
          if ! is_bool "$FAIL_ON"; then
            echo "Invalid input fail_on_budget_exceed=$FAIL_ON (must be true/false)" >&2
            exit 2
          fi

          {
            echo "run_live=$RUN_LIVE"
            echo "max_usd=$MAX_USD"
            echo "max_input_tokens=$MAX_IN_TOK"
            echo "max_output_tokens_per_call=$MAX_OUT_TOK"
            echo "fail_on_budget_exceed=$FAIL_ON"
          } > "${OUTPUT_DIR}/preflight/v5_inputs.txt"

      - name: "Fetch issue context (title/body/comments)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ steps.vars.outputs.issue_num }}
        run: |
          set -euo pipefail

          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE" \
            > "${OUTPUT_DIR}/context/issue.json"

          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/issues/$ISSUE/comments?per_page=100" \
            > "${OUTPUT_DIR}/context/comments.json"

      - name: "Snapshot OpenAI config into preflight artifact (if present)"
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".ai/openai.config.json" ]; then
            cp ".ai/openai.config.json" "${OUTPUT_DIR}/preflight/openai.config.json"
          fi

      - name: "LIVE gate + budget preflight (no OpenAI calls)"
        id: live_gate
        shell: bash
        env:
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          INPUT_RUN_LIVE: ${{ inputs.run_live }}
          INPUT_FAIL_ON: ${{ inputs.fail_on_budget_exceed }}
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_MAX_IN_TOK: ${{ inputs.max_input_tokens }}
          INPUT_MAX_OUT_TOK: ${{ inputs.max_output_tokens_per_call }}
        run: |
          set -euo pipefail

          RUN_LIVE="${INPUT_RUN_LIVE}"
          FAIL_ON="${INPUT_FAIL_ON}"
          MAX_USD="${INPUT_MAX_USD}"
          MAX_IN_TOK="${INPUT_MAX_IN_TOK}"
          MAX_OUT_TOK="${INPUT_MAX_OUT_TOK}"
          LIVE_ON="${LIVE_ENABLED:-false}"
          CFG=".ai/openai.config.json"

          RUN_EFF="false"
          if [ "$RUN_LIVE" = "true" ] && [ "$LIVE_ON" = "true" ]; then
            RUN_EFF="true"
          fi
          echo "run_live_effective=$RUN_EFF" >> "$GITHUB_OUTPUT"

          if [ "$RUN_EFF" != "true" ]; then
            {
              echo "run_live_requested=$RUN_LIVE"
              echo "live_enabled_var=$LIVE_ON"
              echo "run_live_effective=false"
              echo "note=LIVE not enabled (either run_live=false or LIVE_ENABLED!=true). No OpenAI will run."
            } > "${OUTPUT_DIR}/preflight/live_gate.txt"
            exit 0
          fi

          if [ ! -f "$CFG" ]; then
            echo "LIVE enabled but missing config: $CFG" >&2
            exit 3
          fi

          python3 .ai/scripts/live_preflight.py \
            --cfg "$CFG" \
            --issue_json "${OUTPUT_DIR}/context/issue.json" \
            --comments_json "${OUTPUT_DIR}/context/comments.json" \
            --max_out_tok "$MAX_OUT_TOK" \
            --max_in_tok "$MAX_IN_TOK" \
            --max_usd "$MAX_USD" \
            --fail_on "$FAIL_ON" \
            --out_dir "${OUTPUT_DIR}/preflight"

      - name: "Upload context artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-context
          path: ${{ env.OUTPUT_DIR }}/context

      - name: "Upload preflight report artifact"
        uses: actions/upload-artifact@v4
        with:
          name: preflight-out
          path: ${{ env.OUTPUT_DIR }}/preflight

  dev:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install jq"
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Generate deterministic patch from issue.json"
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ needs.preflight.outputs.issue_num }}"
          mkdir -p .ai/dev

          TITLE="$(jq -r '.title // ""' output/context/issue.json)"
          BODY="$(jq -r '.body // ""' output/context/issue.json)"
          URL="$(jq -r '.html_url // ""' output/context/issue.json)"
          USER="$(jq -r '.user.login // ""' output/context/issue.json)"
          CREATED="$(jq -r '.created_at // ""' output/context/issue.json)"

          OUT=".ai/dev/issue_${ISSUE_NUM}.md"
          : > "$OUT"
          printf "# Issue %s\n\n" "$ISSUE_NUM" >> "$OUT"
          printf "URL: %s\n\n" "$URL" >> "$OUT"
          printf "Author: %s\n" "$USER" >> "$OUT"
          printf "Created: %s\n\n" "$CREATED" >> "$OUT"
          printf "## Title\n%s\n\n" "$TITLE" >> "$OUT"
          printf "## Body\n%s\n" "$BODY" >> "$OUT"

      - name: "Commit to branch"
        shell: bash
        run: |
          set -euo pipefail
          BR="${{ needs.preflight.outputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add .ai/dev
          git commit -m "ai-debug: add deterministic summary for issue #${{ needs.preflight.outputs.issue_num }}" || true
          git push -u origin "$BR" --force

      - name: "Create/Update PR"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${{ needs.preflight.outputs.branch_name }}"
          TITLE="ai-debug: issue #${{ needs.preflight.outputs.issue_num }}"
          BODY="Deterministic patch generated from issue.json (no LLM)."
          gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY" 2>/dev/null || \
          gh pr edit "$BR" --title "$TITLE" --body "$BODY"

      - name: "Upload DEV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: dev-out
          path: .ai/dev

  qa:
    runs-on: ubuntu-latest
    needs: dev
    steps:
      - name: "Download DEV artifact"
        uses: actions/download-artifact@v4
        with:
          name: dev-out
          path: qa_artifacts

      - name: "QA checks"
        shell: bash
        run: |
          set -euo pipefail
          ls -la qa_artifacts
          test "$(find qa_artifacts -maxdepth 1 -type f -name 'issue_*.md' | wc -l)" -ge 1
          echo "QA OK: issue summary exists"

  arch_live:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.run_live_effective == 'true'
    steps:
      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Download preflight artifact (includes openai.config snapshot)"
        uses: actions/download-artifact@v4
        with:
          name: preflight-out
          path: output/preflight

      - name: "Run ARCH (OpenAI Responses API)"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          test -f output/preflight/openai.config.json

          MODEL="$(python3 .ai/scripts/read_role_config.py --cfg output/preflight/openai.config.json --role arch --field model)"
          MOUT="$(python3 .ai/scripts/read_role_config.py --cfg output/preflight/openai.config.json --role arch --field max_output_tokens)"

          TITLE="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('title',''))")"
          BODY="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('body',''))")"
          URL="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('html_url',''))")"

          SYS="You are ARCH. Produce a crisp implementation plan in Markdown. No code. Output must be deterministic-style: bullet steps, assumptions, risks, tests."
          USR="Context:\nURL: ${URL}\n\nTitle:\n${TITLE}\n\nBody:\n${BODY}\n\nTask:\nWrite ARCH plan for next changes in this repo. Keep it short and actionable."

          mkdir -p output/live/arch
          python3 .ai/scripts/openai_call.py \
            --model "$MODEL" \
            --max_output_tokens "$MOUT" \
            --system "$SYS" \
            --user "$USR" \
            --out_dir output/live/arch

      - name: "Upload LIVE ARCH artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-arch
          path: output/live/arch

  dev_live:
    runs-on: ubuntu-latest
    needs: arch_live
    if: needs.arch_live.result == 'success'
    steps:
      - name: "Download context artifact"
        uses: actions/download-artifact@v4
        with:
          name: ai-debug-context
          path: output/context

      - name: "Download preflight artifact (includes openai.config snapshot)"
        uses: actions/download-artifact@v4
        with:
          name: preflight-out
          path: output/preflight

      - name: "Download LIVE ARCH artifact"
        uses: actions/download-artifact@v4
        with:
          name: live-arch
          path: output/live/arch

      - name: "Run DEV (OpenAI Responses API)"
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          test -f output/preflight/openai.config.json
          test -f output/live/arch/arch.md

          MODEL="$(python3 .ai/scripts/read_role_config.py --cfg output/preflight/openai.config.json --role dev --field model)"
          MOUT="$(python3 .ai/scripts/read_role_config.py --cfg output/preflight/openai.config.json --role dev --field max_output_tokens)"

          ISSUE_NUM="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); v=d.get('number',''); print(v if v is not None else '')")"
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM="${{ needs.preflight.outputs.issue_num }}"
          fi

          TITLE="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('title',''))")"
          BODY="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('body',''))")"
          URL="$(python3 -c "import json; d=json.load(open('output/context/issue.json','r',encoding='utf-8')); print(d.get('html_url',''))")"

          ARCH_PLAN="$(cat output/live/arch/arch.md)"

          SYS="You are DEV. Produce a deterministic patch proposal in Markdown. No shell commands. No git. Output only Markdown for file .ai/dev/issue_<N>.md."
          USR="Goal:\nGenerate the content of file: .ai/dev/issue_${ISSUE_NUM}.md\n\nInputs:\nURL: ${URL}\nTitle: ${TITLE}\nBody:\n${BODY}\n\nARCH plan:\n${ARCH_PLAN}\n\nRules:\n- Output MUST be valid Markdown.\n- Include: Summary, Proposed changes, Files to touch, Tests, Risks.\n- Do not include code blocks unless strictly necessary.\n- Keep it concise and actionable."

          mkdir -p output/live/dev
          python3 .ai/scripts/openai_call.py \
            --model "$MODEL" \
            --max_output_tokens "$MOUT" \
            --system "$SYS" \
            --user "$USR" \
            --out_dir output/live/dev

          # openai_call writes arch.md by design; rename to issue_<N>.md for DEV stage
          test -f output/live/dev/arch.md
          mv output/live/dev/arch.md "output/live/dev/issue_${ISSUE_NUM}.md"

      - name: "Upload LIVE DEV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-dev
          path: output/live/dev

  qa_live:
    runs-on: ubuntu-latest
    needs: dev_live
    if: needs.dev_live.result == 'success'
    steps:
      - name: "Download LIVE DEV artifact"
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          path: output/live/dev

      - name: "QA LIVE checks (artifacts only)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/live/qa

          test "$(find output/live/dev -maxdepth 1 -type f -name 'issue_*.md' | wc -l)" -ge 1
          test -f output/live/dev/response.json

          {
            echo "# QA LIVE report"
            echo ""
            echo "PASS: DEV generated issue_*.md and response.json."
            echo "Note: This QA checks artifacts only. No repo checkout."
          } > output/live/qa/report.md

      - name: "Upload LIVE QA artifact"
        uses: actions/upload-artifact@v4
        with:
          name: live-qa
          path: output/live/qa
