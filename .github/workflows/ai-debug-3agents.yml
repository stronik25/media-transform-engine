name: AI Debug (3 agents: ARCH -> DEV -> QA)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode (no API, no secrets)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare folders (safe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai ci output

      - name: Validate secrets/vars presence (only if NOT dry-run)
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::Missing secret: OPENAI_API_KEY"
            missing=1
          fi

          for v in ARCH_MODEL DEV_MODEL QA_MODEL LLM_ENDPOINT; do
            if [ -z "${{ vars[format('{0}', v)] }}" ]; then
              echo "::error::Missing repo variable: $v"
              missing=1
            fi
          done

          exit $missing

  arch:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ARCH prompt
        shell: bash
        run: |
          set -euo pipefail
          cat > output/arch_prompt.txt <<EOF
You are ARCH agent. Analyze the issue and produce a plan.
issue=${{ inputs.issue }}
dry_run=${{ inputs.dry_run }}
EOF

      - name: DRY-RUN: placeholder ARCH result
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/arch_result.txt <<'EOF'
DRY-RUN MODE
- No API calls were made.
- Placeholder ARCH plan produced.
EOF

      - name: REAL: call ARCH model (stub)
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.ARCH_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "REAL MODE would call endpoint=$ENDPOINT model=$MODEL" > output/arch_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arch-output
          path: output/

  dev:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arch-output
          path: output/

      - name: Build DEV prompt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "You are DEV agent. Implement based on ARCH."
            echo "dry_run=${{ inputs.dry_run }}"
            echo
            echo "ARCH_RESULT:"
            cat output/arch_result.txt
          } > output/dev_prompt.txt

      - name: DRY-RUN: placeholder DEV result
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/dev_result.txt <<'EOF'
DRY-RUN MODE
- No API calls were made.
- No repo files modified.
- Placeholder DEV changeset produced.
EOF

      - name: REAL: call DEV model (stub)
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.DEV_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "REAL MODE would call endpoint=$ENDPOINT model=$MODEL" > output/dev_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dev-output
          path: output/

  qa:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dev-output
          path: output/

      - name: Build QA prompt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "You are QA agent. Review implementation."
            echo "dry_run=${{ inputs.dry_run }}"
            echo
            echo "DEV_RESULT:"
            cat output/dev_result.txt
          } > output/qa_prompt.txt

      - name: DRY-RUN: placeholder QA report
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > output/qa_report.txt <<'EOF'
DRY-RUN MODE
Verdict: PASS (simulated)
- No API calls were made.
EOF

      - name: REAL: call QA model (stub)
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.QA_MODEL }}
          ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "REAL MODE would call endpoint=$ENDPOINT model=$MODEL" > output/qa_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qa-output
          path: output/
