name: AI Debug (3 agents: ARCH -> DEV -> QA)

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to use as task"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repo structure (clear errors)
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          need_file() { if [ ! -f "$1" ]; then echo "::error::Missing required file: $1"; missing=1; fi; }
          need_dir()  { if [ ! -d "$1" ]; then echo "::error::Missing required dir: $1";  missing=1; fi; }

          need_dir "ci"
          need_file "ci/llm_call.sh"
          need_file "ci/pack_context.sh"
          need_file "ci/extract_message.py"
          need_file "ci/apply_changes.py"
          need_file "ci/guard_allowlist.sh"
          need_file "ci/accept.sh"

          need_dir ".ai"
          need_file ".ai/contract.md"
          need_file ".ai/allowlist.txt"
          need_dir ".ai/prompts"
          need_file ".ai/prompts/arch.md"
          need_file ".ai/prompts/dev.md"
          need_file ".ai/prompts/qa.md"

          if [ "$missing" -eq 1 ]; then
            echo "::error::Preflight failed: repo scaffolding is incomplete."
            exit 1
          fi

      - name: Validate secrets/vars presence (no echo)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          ARCH_MODEL: ${{ vars.ARCH_MODEL }}
          DEV_MODEL:  ${{ vars.DEV_MODEL }}
          QA_MODEL:   ${{ vars.QA_MODEL }}
        run: |
          set -euo pipefail
          [ -n "${OPENAI_API_KEY:-}" ] || { echo "::error::Missing secret OPENAI_API_KEY"; exit 1; }
          [ -n "${LLM_ENDPOINT:-}" ]   || { echo "::error::Missing secret LLM_ENDPOINT (https://api.openai.com/v1/responses)"; exit 1; }
          [ -n "${ARCH_MODEL:-}" ]     || { echo "::error::Missing var ARCH_MODEL"; exit 1; }
          [ -n "${DEV_MODEL:-}" ]      || { echo "::error::Missing var DEV_MODEL"; exit 1; }
          [ -n "${QA_MODEL:-}" ]       || { echo "::error::Missing var QA_MODEL"; exit 1; }

  arch:
    needs: preflight
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ai-debug') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Build context
        run: |
          chmod +x ci/*.sh
          ci/pack_context.sh ci/context.md

      - name: Resolve ISSUE_NUM
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ARCH user prompt
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUM="${{ steps.issue.outputs.num }}"

          {
            echo "TASK:"
            if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "0" ]; then
              echo "Issue title/body:"
              echo "### TITLE"
              echo "${{ github.event.issue.title || '' }}"
              echo ""
              echo "### BODY"
              echo "${{ github.event.issue.body || '' }}"
            else
              echo "No issue provided. Use contract.md as the default goal."
            fi
            echo ""
            echo "REPO CONTEXT:"
            cat ci/context.md
          } > ci/arch_user.md

      - name: Call ARCH model
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.ARCH_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/arch.md ci/arch_user.md ci/arch_raw.json
          python3 ci/extract_message.py ci/arch_raw.json ci/plan.json
          python3 -m json.tool ci/plan.json > /dev/null

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ci/plan.json

  dev:
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci

      - name: Build context
        run: |
          chmod +x ci/*.sh
          ci/pack_context.sh ci/context.md

      - name: Build DEV user prompt
        run: |
          {
            echo "CONTRACT:"
            cat .ai/contract.md
            echo ""
            echo "ALLOWLIST:"
            cat .ai/allowlist.txt
            echo ""
            echo "PLAN_JSON:"
            cat ci/plan.json
            echo ""
            echo "REPO CONTEXT:"
            cat ci/context.md
          } > ci/dev_user.md

      - name: DEV attempt 1
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.DEV_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/dev.md ci/dev_user.md ci/dev_raw.json
          python3 ci/extract_message.py ci/dev_raw.json ci/changes.json
          python3 -m json.tool ci/changes.json > /dev/null

      - name: Apply changes
        run: |
          set -euo pipefail
          python3 ci/apply_changes.py ci/changes.json

      - name: Run guard + accept
        run: |
          set -euo pipefail
          chmod +x ci/guard_allowlist.sh ci/accept.sh
          BASE_REF="origin/main" ci/guard_allowlist.sh | tee ci/allowlist.log
          bash ci/accept.sh | tee ci/accept.log

      - name: Upload logs/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-run
          path: |
            ci/changes.json
            ci/allowlist.log
            ci/accept.log
            output/**

      - name: Create PR (only if checks passed and there are changes)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit; skipping PR."
            exit 0
          fi

          BR="ai/debug-${{ github.run_id }}"
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "AI debug fixes (run ${{ github.run_id }})"
          git push origin "$BR"

          PR_URL="$(gh pr create \
            --title "AI debug fixes (run ${{ github.run_id }})" \
            --body "Generated by 3-agent workflow.\n\n- allowlist: PASS\n- accept: PASS\nArtifacts: dev-run" \
            --base main --head "$BR")"

          echo "$PR_URL" > ci/pr_url.txt

      - name: Upload PR url (if created)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ci/pr_url.txt

  qa:
    needs: dev
    if: ${{ needs.dev.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      - name: Download dev artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-run
          path: ci

      - name: Download PR url (if exists)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr
          path: ci

      - name: Build QA user prompt
        run: |
          set -euo pipefail
          PR_URL=""
          if [ -f ci/pr_url.txt ]; then PR_URL="$(cat ci/pr_url.txt)"; fi

          DIFF_TXT="(no PR diff available)"
          if [ -n "$PR_URL" ]; then
            DIFF_TXT="$(gh pr diff "$PR_URL" || true)"
          fi

          {
            echo "CONTRACT:"
            cat .ai/contract.md
            echo ""
            echo "ALLOWLIST:"
            cat .ai/allowlist.txt
            echo ""
            echo "DIFF:"
            echo "$DIFF_TXT"
            echo ""
            echo "ALLOWLIST LOG:"
            if [ -f ci/allowlist.log ]; then cat ci/allowlist.log; else echo "(missing)"; fi
            echo ""
            echo "ACCEPT LOG:"
            if [ -f ci/accept.log ]; then cat ci/accept.log; else echo "(missing)"; fi
          } > ci/qa_user.md

      - name: Call QA model
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.QA_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/qa.md ci/qa_user.md ci/qa_raw.json
          python3 ci/extract_message.py ci/qa_raw.json ci/qa.json
          python3 -m json.tool ci/qa.json > /dev/null

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa
          path: ci/qa.json

      - name: Comment QA verdict on PR (best-effort)
        if: ${{ hashFiles('ci/pr_url.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_URL="$(cat ci/pr_url.txt)"
          VERDICT="$(jq -r .verdict ci/qa.json)"
          VIOLATIONS="$(jq -r '.violations[]? | "- [" + .type + "] " + .detail' ci/qa.json || true)"

          BODY="QA verdict: **${VERDICT}**\n\n"
          if [ -n "$VIOLATIONS" ]; then
            BODY="${BODY}Violations:\n${VIOLATIONS}\n"
          else
            BODY="${BODY}(no violations reported)\n"
          fi

          gh pr comment "$PR_URL" --body "$BODY"
