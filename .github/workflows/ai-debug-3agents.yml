name: "AI Debug (skeleton)"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        default: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: "Echo inputs"
        shell: bash
        run: |
          set -euo pipefail
          echo "issue=${{ inputs.issue }}"
          echo "ok"

  arch:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: "ARCH placeholder"
        shell: bash
        run: |
          set -euo pipefail
          echo "ARCH stage placeholder"

  dev:
    runs-on: ubuntu-latest
    needs: arch
    steps:
      - name: "DEV placeholder"
        shell: bash
        run: |
          set -euo pipefail
          echo "DEV stage placeholder"

  qa:
    runs-on: ubuntu-latest
    needs: dev
    steps:
      - name: "QA placeholder"
        shell: bash
        run: |
          set -euo pipefail
          echo "QA stage placeholder"
