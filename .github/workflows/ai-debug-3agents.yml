name: AI Debug (3 agents: ARCH→DEV→QA)

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to use as task (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  arch:
    name: ARCH
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||

      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == 'ai-debug') ||
        (github.event.action != 'labeled' && contains(toJson(github.event.issue.labels), '"name":"ai-debug"'))
      )) ||

      (github.event_name == 'issue_comment' && (
        contains(toLower(github.event.comment.body), '@ai-debug run') &&
        contains(toJson(github.event.issue.labels), '"name":"ai-debug"')
      ))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Build context
        run: |
          chmod +x ci/*.sh
          ci/pack_context.sh ci/context.md

      - name: Resolve issue number + fetch issue (if needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ISSUE_NUM=""

          if [ "${{ github.event_name }}" = "issues" ] || [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"
          else
            ISSUE_NUM="${{ inputs.issue_number }}"
          fi

          echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_ENV

          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "0" ]; then
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/${ISSUE_NUM}" \
              > ci/issue.json
          else
            echo '{}' > ci/issue.json
          fi

      - name: Build ARCH user prompt
        run: |
          set -euo pipefail

          TITLE="$(jq -r '.title // ""' ci/issue.json)"
          BODY="$(jq -r '.body // ""' ci/issue.json)"

          {
            echo "TASK:"
            if [ -n "${ISSUE_NUM}" ] && [ "${ISSUE_NUM}" != "0" ]; then
              echo "Issue title/body:"
              echo "### TITLE"
              echo "${TITLE}"
              echo ""
              echo "### BODY"
              echo "${BODY}"
            else
              echo "No issue provided. Use contract.md as the default goal."
            fi
            echo ""
            echo "REPO CONTEXT:"
            cat ci/context.md
          } > ci/arch_user.md

      - name: Call ARCH model
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/arch.md ci/arch_user.md ci/arch_raw.json
          python3 ci/extract_message.py ci/arch_raw.json ci/plan.json
          python3 -m json.tool ci/plan.json > /dev/null

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ci/plan.json

  dev:
    name: DEV
    needs: arch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci

      - name: Build context
        run: |
          chmod +x ci/*.sh
          ci/pack_context.sh ci/context.md

      - name: Build DEV user prompt
        run: |
          {
            echo "CONTRACT:"
            cat .ai/contract.md
            echo ""
            echo "ALLOWLIST:"
            cat .ai/allowlist.txt
            echo ""
            echo "PLAN_JSON:"
            cat ci/plan.json
            echo ""
            echo "REPO CONTEXT:"
            cat ci/context.md
          } > ci/dev_user.md

      - name: DEV attempt 1
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/dev.md ci/dev_user.md ci/dev_raw.json
          python3 ci/extract_message.py ci/dev_raw.json ci/changes.json
          python3 -m json.tool ci/changes.json > /dev/null

      - name: Apply changes
        run: |
          set -euo pipefail
          python3 ci/apply_changes.py ci/changes.json

      - name: Run guard + accept
        run: |
          set -euo pipefail
          chmod +x ci/guard_allowlist.sh ci/accept.sh
          BASE_REF="origin/main" ci/guard_allowlist.sh | tee ci/allowlist.log
          bash ci/accept.sh | tee ci/accept.log

      - name: Upload logs/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-run
          path: |
            ci/changes.json
            ci/allowlist.log
            ci/accept.log
            output/**

      - name: Create PR (only if checks passed)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BR="ai/debug-${{ github.run_id }}"
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A

          # If no changes, do not create PR
          if git diff --cached --quiet; then
            echo "No changes to commit; skipping PR."
            echo "" > ci/pr_url.txt
            exit 0
          fi

          git commit -m "AI debug fixes (run ${{ github.run_id }})"
          git push origin "$BR"

          PR_URL="$(gh pr create \
            --title "AI debug fixes (run ${{ github.run_id }})" \
            --body "Generated by 3-agent workflow.\n\n- allowlist: PASS\n- accept: PASS\nArtifacts: dev-run" \
            --base main --head "$BR")"

          echo "$PR_URL" > ci/pr_url.txt

      - name: Upload PR url
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ci/pr_url.txt

  qa:
    name: QA
    needs: dev
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      - name: Download dev artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-run
          path: ci

      - name: Download PR url
        uses: actions/download-artifact@v4
        with:
          name: pr
          path: ci

      - name: Build QA user prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_URL=""
          if [ -f ci/pr_url.txt ]; then PR_URL="$(cat ci/pr_url.txt)"; fi

          DIFF_TXT="(no PR diff available)"
          if [ -n "$PR_URL" ]; then
            DIFF_TXT="$(gh pr diff "$PR_URL" || true)"
          fi

          {
            echo "CONTRACT:"
            cat .ai/contract.md
            echo ""
            echo "ALLOWLIST:"
            cat .ai/allowlist.txt
            echo ""
            echo "DIFF:"
            echo "$DIFF_TXT"
            echo ""
            echo "ALLOWLIST LOG:"
            if [ -f ci/allowlist.log ]; then cat ci/allowlist.log; else echo "(missing)"; fi
            echo ""
            echo "ACCEPT LOG:"
            if [ -f ci/accept.log ]; then cat ci/accept.log; else echo "(missing)"; fi
          } > ci/qa_user.md

      - name: Call QA model
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ci/llm_call.sh
          ci/llm_call.sh .ai/prompts/qa.md ci/qa_user.md ci/qa_raw.json
          python3 ci/extract_message.py ci/qa_raw.json ci/qa.json
          python3 -m json.tool ci/qa.json > /dev/null

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa
          path: ci/qa.json

      - name: Comment QA verdict on PR (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_URL=""
          if [ -f ci/pr_url.txt ]; then PR_URL="$(cat ci/pr_url.txt)"; fi
          if [ -z "$PR_URL" ]; then
            echo "No PR URL; skipping PR comment."
            exit 0
          fi

          VERDICT="$(jq -r '.verdict // "UNKNOWN"' ci/qa.json)"
          VIOLATIONS="$(jq -r '.violations[]? | "- [" + .type + "] " + .detail' ci/qa.json || true)"

          BODY="QA verdict: **${VERDICT}**\n\n"
          if [ -n "$VIOLATIONS" ]; then
            BODY="${BODY}Violations:\n${VIOLATIONS}\n"
          else
            BODY="${BODY}(no violations reported)\n"
          fi

          gh pr comment "$PR_URL" --body "$BODY"
