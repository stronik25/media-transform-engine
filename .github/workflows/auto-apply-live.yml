name: "AUTO: Apply LIVE DEV when AI Debug requests apply_live=true"

on:
  workflow_run:
    workflows:
      - "AI Debug (v5 gates; v4 deterministic default)"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  auto_apply:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Kill-switch (repo var AUTO_APPLY_ENABLED must be true)
        id: kill
        shell: bash
        env:
          AUTO_APPLY_ENABLED_VAR: ${{ vars.AUTO_APPLY_ENABLED }}
        run: |
          set -euo pipefail
          v="$(printf "%s" "${AUTO_APPLY_ENABLED_VAR:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$v" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AUTO_APPLY_ENABLED is not true -> skip (green)"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "AUTO apply enabled"

      - name: Install jq
        if: ${{ steps.kill.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download AI Debug artifacts (context + preflight)
        if: ${{ steps.kill.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf _ai_debug_artifacts
          mkdir -p _ai_debug_artifacts/context _ai_debug_artifacts/preflight

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "ai-debug-context" \
            --dir "_ai_debug_artifacts/context"

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "preflight-out" \
            --dir "_ai_debug_artifacts/preflight" || true

          find _ai_debug_artifacts -type f -print || true

      - name: Decide if apply_live was requested
        if: ${{ steps.kill.outputs.enabled == 'true' }}
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_JSON="$(find _ai_debug_artifacts/context -type f -name issue.json | head -n 1 || true)"
          if [ -z "$ISSUE_JSON" ]; then
            echo "ERROR: issue.json not found" >&2
            exit 21
          fi

          ISSUE="$(jq -r '.number // empty' "$ISSUE_JSON")"
          if ! echo "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: invalid issue number: $ISSUE" >&2
            exit 22
          fi

          APPLY="false"
          SUMMARY_TXT="$(find _ai_debug_artifacts/preflight -type f -name summary.txt | head -n 1 || true)"
          if [ -n "$SUMMARY_TXT" ] && grep -Eq '^apply_live_input_norm=true$' "$SUMMARY_TXT"; then
            APPLY="true"
          fi

          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "Decision: issue=$ISSUE apply_live=$APPLY"

      - name: Stop if apply_live not requested
        if: ${{ steps.kill.outputs.enabled == 'true' && steps.decide.outputs.apply != 'true' }}
        run: echo "apply_live not requested → green exit"

      - name: Prevent duplicate apply for same run_id (best-effort)
        if: ${{ steps.kill.outputs.enabled == 'true' && steps.decide.outputs.apply == 'true' }}
        id: dedupe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          APPLY_WF_NAME="Apply LIVE DEV (by run_id)"

          # Найдём workflow id по имени
          WF_ID="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/actions/workflows" \
            --jq ".workflows[] | select(.name==\"${APPLY_WF_NAME}\") | .id" | head -n 1 || true)"

          if [ -z "$WF_ID" ]; then
            echo "ERROR: Apply workflow '${APPLY_WF_NAME}' not found" >&2
            exit 31
          fi

          # Проверим последние runs этого workflow — уже был ли запуск с нашим RUN_ID в inputs (best-effort по логам не гарантирован)
          # Надёжно: мы пишем run_id в body PR, а глобально дедупим через digest в Apply.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Dedupe OK (global replay-guard is in Apply anyway)"

      - name: Trigger Apply LIVE DEV workflow (by NAME)
        if: ${{ steps.kill.outputs.enabled == 'true' && steps.decide.outputs.apply == 'true' && steps.dedupe.outputs.skip != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE: ${{ steps.decide.outputs.issue }}
        run: |
          set -euo pipefail

          gh workflow run "Apply LIVE DEV (by run_id)" \
            --repo "${OWNER}/${REPO}" \
            --ref "main" \
            -f run_id="${RUN_ID}" \
            -f issue="${ISSUE}" \
            -f base_branch="main" \
            -f dry_run="false" \
            -f qa_enabled="true" \
            -f write_digest_history="true"

          echo "Apply LIVE DEV triggered automatically"
