name: "AUTO: Apply LIVE DEV when AI Debug requests apply_live=true"

on:
  workflow_run:
    workflows:
      - "AI Debug (v5 gates; v4 deterministic default)"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  auto_apply:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download AI Debug artifacts (context + preflight)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf _ai_debug_artifacts _auto_out
          mkdir -p _ai_debug_artifacts/context _ai_debug_artifacts/preflight _auto_out

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "ai-debug-context" \
            --dir "_ai_debug_artifacts/context"

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "preflight-out" \
            --dir "_ai_debug_artifacts/preflight" || true

          echo "Artifacts:"
          find _ai_debug_artifacts -type f -maxdepth 6 -print || true

      - name: Decide (apply_live + kill-switch + mode)
        id: decide
        shell: bash
        env:
          AUTO_APPLY_ENABLED: ${{ vars.AUTO_APPLY_ENABLED }}
          AUTO_APPLY_MODE: ${{ vars.AUTO_APPLY_MODE }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          norm_bool () {
            v="$(printf "%s" "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            [ "$v" = "true" ] && echo "true" || echo "false"
          }

          ENABLED="$(norm_bool "${AUTO_APPLY_ENABLED:-false}")"
          MODE="$(printf "%s" "${AUTO_APPLY_MODE:-apply}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ -n "$MODE" ] || MODE="apply"
          if [ "$MODE" != "apply" ] && [ "$MODE" != "dry-run" ]; then
            MODE="invalid"
          fi

          ISSUE_JSON="$(find _ai_debug_artifacts/context -type f -name issue.json | head -n 1 || true)"
          if [ -z "$ISSUE_JSON" ]; then
            echo "ERROR: issue.json not found" >&2
            exit 21
          fi

          ISSUE="$(jq -r '.number // empty' "$ISSUE_JSON")"
          if ! echo "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: invalid issue number: $ISSUE" >&2
            exit 22
          fi

          APPLY_REQ="false"
          SUMMARY_TXT="$(find _ai_debug_artifacts/preflight -type f -name summary.txt | head -n 1 || true)"
          if [ -n "$SUMMARY_TXT" ] && grep -Eq '^apply_live_input_norm=true$' "$SUMMARY_TXT"; then
            APPLY_REQ="true"
          fi

          SHOULD_TRIGGER="false"
          REASON=""

          if [ "$ENABLED" != "true" ]; then
            REASON="AUTO_APPLY_ENABLED!=true"
          elif [ "$APPLY_REQ" != "true" ]; then
            REASON="apply_live_not_requested"
          elif [ "$MODE" = "invalid" ]; then
            REASON="AUTO_APPLY_MODE_invalid"
          elif [ "$MODE" = "dry-run" ]; then
            REASON="AUTO_APPLY_MODE=dry-run"
          else
            SHOULD_TRIGGER="true"
            REASON="apply"
          fi

          mkdir -p _auto_out
          jq -n \
            --arg owner "$OWNER" \
            --arg repo "$REPO" \
            --arg ai_debug_run_id "$RUN_ID" \
            --arg issue "$ISSUE" \
            --arg auto_apply_enabled_norm "$ENABLED" \
            --arg auto_apply_mode_norm "$MODE" \
            --arg reason "$REASON" \
            --argjson apply_live_requested "$( [ "$APPLY_REQ" = "true" ] && echo true || echo false )" \
            --argjson should_trigger_apply "$( [ "$SHOULD_TRIGGER" = "true" ] && echo true || echo false )" \
            '{
              owner: $owner,
              repo: $repo,
              ai_debug_run_id: $ai_debug_run_id,
              issue: $issue,
              apply_live_requested: $apply_live_requested,
              auto_apply_enabled_norm: $auto_apply_enabled_norm,
              auto_apply_mode_norm: $auto_apply_mode_norm,
              should_trigger_apply: $should_trigger_apply,
              reason: $reason
            }' > _auto_out/decision.json

          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "should_trigger=$SHOULD_TRIGGER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "Decision:"
          cat _auto_out/decision.json

      - name: Upload AUTO decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-apply-decision
          path: _auto_out/decision.json
          retention-days: 14

      - name: Stop (no trigger)
        if: ${{ steps.decide.outputs.should_trigger != 'true' }}
        run: echo "AUTO: not triggering Apply (green). reason=${{ steps.decide.outputs.reason }}"

      - name: Trigger Apply LIVE DEV workflow (by name)
        if: ${{ steps.decide.outputs.should_trigger == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE: ${{ steps.decide.outputs.issue }}
        run: |
          set -euo pipefail

          gh workflow run "Apply LIVE DEV (by run_id)" \
            --repo "${OWNER}/${REPO}" \
            --ref "main" \
            -f run_id="${RUN_ID}" \
            -f issue="${ISSUE}" \
            -f base_branch="main" \
            -f dry_run="false" \
            -f qa_enabled="true" \
            -f write_digest_history="true"

          echo "AUTO: Apply triggered"
