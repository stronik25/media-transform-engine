name: "AUTO: Apply LIVE DEV when AI Debug requests apply_live=true"

on:
  workflow_run:
    workflows:
      - "AI Debug (v5 gates; v4 deterministic default)"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  auto_apply:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download AI Debug artifacts (context + preflight)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf _ai_debug_artifacts _auto_out
          mkdir -p _ai_debug_artifacts/context _ai_debug_artifacts/preflight _auto_out

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "ai-debug-context" \
            --dir "_ai_debug_artifacts/context"

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "preflight-out" \
            --dir "_ai_debug_artifacts/preflight" || true

          echo "Artifacts:"
          find _ai_debug_artifacts -maxdepth 6 -type f -print || true

      - name: Decide (apply_live + kill-switch + mode)
        id: decide
        shell: bash
        env:
          AUTO_APPLY_ENABLED: ${{ vars.AUTO_APPLY_ENABLED }}
          AUTO_APPLY_MODE: ${{ vars.AUTO_APPLY_MODE }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          norm_bool () {
            v="$(printf "%s" "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            [ "$v" = "true" ] && echo "true" || echo "false"
          }

          ENABLED="$(norm_bool "${AUTO_APPLY_ENABLED:-false}")"

          MODE="$(printf "%s" "${AUTO_APPLY_MODE:-apply}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [ -n "$MODE" ] || MODE="apply"
          if [ "$MODE" != "apply" ] && [ "$MODE" != "dry-run" ]; then
            MODE="invalid"
          fi

          ISSUE_JSON="$(find _ai_debug_artifacts/context -type f -name issue.json | head -n 1 || true)"
          if [ -z "$ISSUE_JSON" ]; then
            echo "ERROR: issue.json not found" >&2
            exit 21
          fi
          test -s "$ISSUE_JSON"

          ISSUE="$(python3 -c 'import json,sys; p=sys.argv[1]; j=json.load(open(p,"r",encoding="utf-8")); v=j.get("number"); print("" if v is None else str(v))' "$ISSUE_JSON")"
          if ! echo "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: invalid issue number: $ISSUE" >&2
            exit 22
          fi

          APPLY_REQ="false"
          SUMMARY_TXT="$(find _ai_debug_artifacts/preflight -type f -name summary.txt | head -n 1 || true)"
          if [ -n "$SUMMARY_TXT" ] && grep -Eq '^apply_live_input_norm=true$' "$SUMMARY_TXT"; then
            APPLY_REQ="true"
          fi

          SHOULD_TRIGGER="false"
          REASON=""

          if [ "$ENABLED" != "true" ]; then
            REASON="AUTO_APPLY_ENABLED!=true"
          elif [ "$APPLY_REQ" != "true" ]; then
            REASON="apply_live_not_requested"
          elif [ "$MODE" = "invalid" ]; then
            REASON="AUTO_APPLY_MODE_invalid"
          elif [ "$MODE" = "dry-run" ]; then
            REASON="AUTO_APPLY_MODE=dry-run"
          else
            SHOULD_TRIGGER="true"
            REASON="apply"
          fi

          export ISSUE APPLY_REQ ENABLED MODE SHOULD_TRIGGER REASON OWNER REPO RUN_ID RUN_URL

          python3 -c 'import json,os; out={"owner":os.environ.get("OWNER",""),"repo":os.environ.get("REPO",""),"ai_debug_run_id":os.environ.get("RUN_ID",""),"ai_debug_run_url":os.environ.get("RUN_URL",""),"issue":os.environ.get("ISSUE",""),"apply_live_requested":(os.environ.get("APPLY_REQ","false")=="true"),"auto_apply_enabled_norm":os.environ.get("ENABLED","false"),"auto_apply_mode_norm":os.environ.get("MODE",""),"should_trigger_apply":(os.environ.get("SHOULD_TRIGGER","false")=="true"),"reason":os.environ.get("REASON","")}; f=open("_auto_out/decision.json","w",encoding="utf-8"); json.dump(out,f,ensure_ascii=False,indent=2); f.close()'

          test -s _auto_out/decision.json

          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "should_trigger=$SHOULD_TRIGGER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "Decision:"
          cat _auto_out/decision.json

      - name: Upload AUTO decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-apply-decision
          path: _auto_out/decision.json
          retention-days: 14

      - name: Stop (no trigger)
        if: ${{ steps.decide.outputs.should_trigger != 'true' }}
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "AUTO: not triggering Apply (green). reason=${REASON}"

      - name: Trigger Apply LIVE DEV workflow (by name)
        if: ${{ steps.decide.outputs.should_trigger == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE: ${{ steps.decide.outputs.issue }}
        run: |
          set -euo pipefail

          gh workflow run "Apply LIVE DEV (by run_id)" \
            --repo "${OWNER}/${REPO}" \
            --ref "main" \
            -f run_id="${RUN_ID}" \
            -f issue="${ISSUE}" \
            -f base_branch="main" \
            -f dry_run="false" \
            -f qa_enabled="true" \
            -f write_digest_history="true"

          echo "AUTO: Apply triggered"
