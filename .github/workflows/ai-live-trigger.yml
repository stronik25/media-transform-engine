name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: false
        default: "main"
        type: string
      artifact_name:
        description: "Artifact name to apply"
        required: false
        default: "live-dev"
        type: string
      dry_run:
        description: "If true: validate only (no branch/PR)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download LIVE DEV artifact from run_id
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _live_dev_artifact
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate + normalize artifact contents
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          ART_DIR: _live_dev_artifact
        run: |
          set -euo pipefail
          python3 scripts/apply_live_dev.py validate

      - name: Stop after validation (dry_run=true)
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "dry_run=true; stopping after validation."

      - name: Apply + branch + PR (dry_run=false)
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          ART_DIR: _live_dev_artifact
        run: |
          set -euo pipefail
          python3 scripts/apply_live_dev.py apply
