name: "AI LIVE trigger (label/comment -> dispatch AI Debug, status)"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

env:
  AI_DEBUG_WORKFLOW_FILE: "ai-debug-3agents.yml"
  DEFAULT_MAX_USD: "0.50"
  DEFAULT_MAX_IN: "12000"
  DEFAULT_MAX_OUT: "1200"
  DEFAULT_FAIL_ON_CAP: "true"
  TRIGGER_LABEL: "ai-live"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: "Decide action"
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          action="none"   # dispatch | status | none
          reason=""
          issue_num="${ISSUE_NUM}"

          # Label trigger -> dispatch
          if [ "${EVENT_NAME}" = "issues" ] && [ "${LABEL_NAME}" = "${TRIGGER_LABEL}" ]; then
            action="dispatch"
            reason="label"
          fi

          # Comment trigger
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            assoc="$(printf "%s" "${AUTHOR_ASSOC}" | tr '[:upper:]' '[:lower:]')"
            case "${assoc}" in owner|member|collaborator) ;; *)
              echo "Untrusted author_association=${AUTHOR_ASSOC}"
              echo "action=none" >> "$GITHUB_OUTPUT"
              echo "issue_num=${issue_num}" >> "$GITHUB_OUTPUT"
              echo "reason=untrusted" >> "$GITHUB_OUTPUT"
              exit 0
            esac

            body="$(printf "%s" "${COMMENT_BODY}" | tr -d '\r')"
            if printf "%s" "${body}" | grep -Eq '(^|[[:space:]])/ai[[:space:]]+live(-run)?([[:space:]]|$)'; then
              action="dispatch"
              reason="comment"
            elif printf "%s" "${body}" | grep -Eq '(^|[[:space:]])/ai[[:space:]]+status([[:space:]]|$)'; then
              action="status"
              reason="status"
            fi
          fi

          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "issue_num=${issue_num}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "action=${action} issue=${issue_num} reason=${reason}"

      - name: "Dispatch AI Debug (run_live=true, apply_live=false)"
        id: dispatch_ai
        if: ${{ steps.decide.outputs.action == 'dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUM: ${{ steps.decide.outputs.issue_num }}
          REF: "main"
        run: |
          set -euo pipefail

          mkdir -p output
          p="output/dispatch.json"
          : > "$p"
          printf "%s" "{" >> "$p"
          printf "%s" "\"ref\":\"${REF}\"," >> "$p"
          printf "%s" "\"inputs\":{" >> "$p"
          printf "%s" "\"issue\":\"${ISSUE_NUM}\"," >> "$p"
          printf "%s" "\"run_live\":\"true\"," >> "$p"
          printf "%s" "\"apply_live\":\"false\"," >> "$p"
          printf "%s" "\"live_max_usd\":\"${DEFAULT_MAX_USD}\"," >> "$p"
          printf "%s" "\"live_max_input_tokens\":\"${DEFAULT_MAX_IN}\"," >> "$p"
          printf "%s" "\"live_max_output_tokens\":\"${DEFAULT_MAX_OUT}\"," >> "$p"
          printf "%s" "\"live_fail_on_cap\":\"${DEFAULT_FAIL_ON_CAP}\"" >> "$p"
          printf "%s" "}}" >> "$p"

          api="https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${AI_DEBUG_WORKFLOW_FILE}/dispatches"
          code="$(curl -sS -o output/dispatch_response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "@${p}" \
            "${api}")"

          if [ "${code}" != "204" ]; then
            echo "ERROR: dispatch failed (http ${code})" >&2
            cat output/dispatch_response.txt >&2 || true
            exit 7
          fi

          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: "Comment back (dispatch)"
        if: ${{ steps.decide.outputs.action == 'dispatch' && steps.dispatch_ai.outputs.dispatched == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUM: ${{ steps.decide.outputs.issue_num }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          wf="https://github.com/${OWNER}/${REPO}/actions/workflows/${AI_DEBUG_WORKFLOW_FILE}"
          msg="Dispatched AI Debug LIVE run (no apply). Trigger=${REASON}. Track runs: ${wf}. Next: run apply-live.yml by run_id after live-dev exists."
          api="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUM}/comments"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "{\"body\":\"${msg}\"}" \
            "${api}"

      - name: "Remove label (one-shot arm)"
        if: ${{ github.event_name == 'issues' && steps.decide.outputs.action == 'dispatch' && steps.dispatch_ai.outputs.dispatched == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUM: ${{ steps.decide.outputs.issue_num }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUM}/labels/${TRIGGER_LABEL}"
          code="$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}")"
          if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
            echo "WARN: failed to remove label (http ${code})" >&2
          fi

      - name: "/ai status (comment)"
        if: ${{ steps.decide.outputs.action == 'status' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUM: ${{ steps.decide.outputs.issue_num }}
        run: |
          set -euo pipefail
          # Find latest AI Debug run on main
          api="https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${AI_DEBUG_WORKFLOW_FILE}/runs?branch=main&per_page=1"
          run_id="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}" | jq -r '.workflow_runs[0].id // empty')"

          if [ -z "${run_id}" ]; then
            msg="No recent AI Debug runs found on main."
          else
            run_url="https://github.com/${OWNER}/${REPO}/actions/runs/${run_id}"
            msg="Latest AI Debug run: ${run_id}\n${run_url}\nNext: apply-live.yml by run_id (after live-dev exists)."
          fi

          api2="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUM}/comments"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "{\"body\":\"${msg}\"}" \
            "${api2}"
