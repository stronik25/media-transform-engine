name: "AI LIVE trigger (label/comment -> dispatch AI Debug)"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write

env:
  AI_DEBUG_WORKFLOW_FILE: "ai-debug-3agents.yml"
  TRIGGER_LABEL: "ai-live"
  REF: "main"

  DEFAULT_MAX_USD: "0.50"
  DEFAULT_MAX_IN: "12000"
  DEFAULT_MAX_OUT: "1200"
  DEFAULT_FAIL_ON_CAP: "true"

jobs:
  dispatch:
    runs-on: ubuntu-latest

    concurrency:
      group: ai-live-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@v4

      - name: Dispatch if armed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 scripts/ai_live_trigger.py
