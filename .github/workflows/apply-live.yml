name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean
      qa_enabled:
        description: "Run QA gate before PR (artifact-applied tree only)"
        required: true
        default: true
        type: boolean
      write_digest_history:
        description: "Append record to .ai/dev/digest-history.jsonl"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.normalize.outputs.digest }}
    steps:
      - name: Download artifact "live-dev" from AI Debug run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_raw _live_dev_norm output
          mkdir -p _live_dev_raw _live_dev_norm/.ai/dev output

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_raw"

          echo "Downloaded live-dev tree:"
          find _live_dev_raw -type f -print

      - name: Normalize artifact + write digest
        id: normalize
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          WANT="issue_${ISSUE}.md"

          SRC_MD="$(find _live_dev_raw -type f -name "${WANT}" | head -n 1 || true)"
          if [ -z "$SRC_MD" ]; then
            echo "ERROR: ${WANT} not found in live-dev artifact" >&2
            find _live_dev_raw -type f -print >&2
            exit 11
          fi

          cp -f "$SRC_MD" "_live_dev_norm/.ai/dev/${WANT}"

          # Best-effort copy request/response (wherever they are)
          SRC_REQ="$(find _live_dev_raw -type f -name "request.json" | head -n 1 || true)"
          SRC_RESP="$(find _live_dev_raw -type f -name "response.json" | head -n 1 || true)"
          [ -n "$SRC_REQ" ] && cp -f "$SRC_REQ" "_live_dev_norm/request.json"
          [ -n "$SRC_RESP" ] && cp -f "$SRC_RESP" "_live_dev_norm/response.json"

          MANIFEST="$(mktemp)"
          trap 'rm -f "$MANIFEST"' EXIT

          sha256sum "_live_dev_norm/.ai/dev/${WANT}" >> "$MANIFEST"
          [ -f "_live_dev_norm/request.json" ] && sha256sum "_live_dev_norm/request.json" >> "$MANIFEST"
          [ -f "_live_dev_norm/response.json" ] && sha256sum "_live_dev_norm/response.json" >> "$MANIFEST"

          DIGEST="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          echo "sha256:${DIGEST}" > output/apply_digest.txt
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload apply-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: |
            _live_dev_norm
            output/apply_digest.txt
          include-hidden-files: true
          retention-days: 7

  dry_run_done:
    if: ${{ inputs.dry_run == true }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - run: echo "dry_run=true → validation OK"

  apply:
    if: ${{ inputs.dry_run == false }}
    needs: validate
    runs-on: ubuntu-latest
    environment: live-apply

    steps:
      - name: Download apply-ready
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Show apply-ready tree
        shell: bash
        run: |
          set -euo pipefail
          echo "apply_ready tree:"
          find apply_ready -type f -print

      - name: QA gate (STRICT, ARTIFACT-ONLY, no git, no network)
        if: ${{ inputs.qa_enabled == true }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          # 1) Strict artifact file allowlist (inside apply_ready)
          # Allowed files:
          # - apply_ready/_live_dev_norm/.ai/dev/issue_<ISSUE>.md
          # - apply_ready/_live_dev_norm/request.json (optional)
          # - apply_ready/_live_dev_norm/response.json (optional)
          # - apply_ready/output/apply_digest.txt
          WANT="issue_${ISSUE}.md"

          BAD_FILES="$(find apply_ready -type f -print | sed 's|^\./||' | grep -Ev "^apply_ready/(_live_dev_norm/\.ai/dev/${WANT}|_live_dev_norm/request\.json|_live_dev_norm/response\.json|output/apply_digest\.txt)$" || true)"
          if [ -n "$BAD_FILES" ]; then
            echo "ERROR: apply_ready contains files outside strict allowlist:" >&2
            echo "$BAD_FILES" >&2
            exit 71
          fi

          # 2) Required files exist + non-empty where needed
          test -s "apply_ready/_live_dev_norm/.ai/dev/${WANT}"
          test -s "apply_ready/output/apply_digest.txt"

          # 3) Digest format validation
          D="$(cat apply_ready/output/apply_digest.txt | tr -d '\r' | head -n 1)"
          echo "$D" | grep -Eq '^sha256:[0-9a-f]{64}$'

          # 4) Optional JSON validity (no jq install, use python stdlib)
          for f in "apply_ready/_live_dev_norm/request.json" "apply_ready/_live_dev_norm/response.json"; do
            if [ -f "$f" ]; then
              python3 -c 'import json,sys; json.load(open(sys.argv[1],"r",encoding="utf-8"))' "$f"
              echo "OK JSON: $f"
            fi
          done

          echo "QA OK (artifact-only)"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Replay guard (GLOBAL + branch) -> sets skip flag
        id: replay
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          CUR_DIG_FILE="$(find apply_ready -type f -path "*/output/apply_digest.txt" | head -n 1 || true)"
          if [ -z "$CUR_DIG_FILE" ]; then
            echo "ERROR: apply_ready/output/apply_digest.txt not found" >&2
            find apply_ready -type f -print >&2
            exit 41
          fi

          CUR_DIG="$(cat "$CUR_DIG_FILE" | tr -d '\r' | head -n 1)"
          if ! echo "$CUR_DIG" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "ERROR: invalid current digest format: $CUR_DIG" >&2
            exit 42
          fi

          # GLOBAL replay guard in main tree (.ai/dev/applied_digests.txt)
          GLOBAL_FILE=".ai/dev/applied_digests.txt"
          if [ -f "$GLOBAL_FILE" ] && grep -Fxq "$CUR_DIG" "$GLOBAL_FILE"; then
            echo "Replay guard (GLOBAL): digest already applied -> skip (green)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch-level replay guard
          BR="ai-live/issue-${ISSUE}"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$BR":"refs/remotes/origin/$BR"
            PREV_DIG="$(git show "origin/$BR:output/apply_digest.txt" 2>/dev/null | tr -d '\r' | head -n 1 || true)"
            if [ -n "$PREV_DIG" ] && [ "$PREV_DIG" = "$CUR_DIG" ]; then
              echo "Replay guard (branch): same digest -> skip (green)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stop early (replay-guard skip)
        if: ${{ steps.replay.outputs.skip == 'true' }}
        run: echo "replay-guard skip → green exit"

      - name: Apply artifact into repo + write state (allowed paths only)
        if: ${{ steps.replay.outputs.skip != 'true' }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          WANT="issue_${ISSUE}.md"
          SRC_MD="$(find apply_ready -type f -path "*/.ai/dev/${WANT}" | head -n 1 || true)"
          if [ -z "$SRC_MD" ]; then
            echo "ERROR: ${WANT} not found inside apply_ready" >&2
            find apply_ready -type f -print >&2
            exit 31
          fi

          SRC_DIG="$(find apply_ready -type f -path "*/output/apply_digest.txt" | head -n 1 || true)"
          if [ -z "$SRC_DIG" ]; then
            echo "ERROR: output/apply_digest.txt not found inside apply_ready" >&2
            find apply_ready -type f -print >&2
            exit 32
          fi

          SRC_REQ="$(find apply_ready -type f -name "request.json" | head -n 1 || true)"
          SRC_RESP="$(find apply_ready -type f -name "response.json" | head -n 1 || true)"

          mkdir -p .ai/dev output
          cp -f "$SRC_MD" ".ai/dev/${WANT}"
          cp -f "$SRC_DIG" "output/apply_digest.txt"

          # Optional copies into .ai/dev with issue suffix
          [ -n "$SRC_REQ" ] && cp -f "$SRC_REQ" ".ai/dev/request_${ISSUE}.json"
          [ -n "$SRC_RESP" ] && cp -f "$SRC_RESP" ".ai/dev/response_${ISSUE}.json"

          CUR="$(cat output/apply_digest.txt | tr -d '\r' | head -n 1)"

          {
            echo "$CUR"
            echo "run_id=${{ inputs.run_id }}"
          } > .ai/dev/.applied_ok

          touch .ai/dev/applied_digests.txt
          grep -Fxq "$CUR" .ai/dev/applied_digests.txt || echo "$CUR" >> .ai/dev/applied_digests.txt

          if [ "${{ inputs.write_digest_history }}" = "true" ]; then
            echo "{\"ts\":\"$(date -u +%FT%TZ)\",\"digest\":\"$CUR\",\"run_id\":\"${{ inputs.run_id }}\",\"issue\":\"${ISSUE}\",\"base\":\"${{ inputs.base_branch }}\"}" >> .ai/dev/digest-history.jsonl
          fi

          git status -sb

      - name: No-diff guard -> sets no_diff flag
        if: ${{ steps.replay.outputs.skip != 'true' }}
        id: nodiff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop early (no diff)
        if: ${{ steps.replay.outputs.skip != 'true' && steps.nodiff.outputs.no_diff == 'true' }}
        run: echo "no-diff skip → green exit"

      - name: Allowlist guard (fail if changes outside allowed paths)
        if: ${{ steps.replay.outputs.skip != 'true' && steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(git diff --name-only | grep -Ev '^(\.ai/dev/|output/apply_digest\.txt$)' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: changes outside allowlist:" >&2
            echo "$BAD" >&2
            exit 61
          fi
          echo "Allowlist OK"

      - name: Create branch + commit + PR
        if: ${{ steps.replay.outputs.skip != 'true' && steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add .ai/dev output/apply_digest.txt
          git commit -m "apply live-dev: issue #${ISSUE}" || true
          git push -u origin "$BR" --force

          TITLE="apply live-dev: issue #${ISSUE}"
          BODY="Applied live-dev artifact from run_id=${{ inputs.run_id }}\n\n$(cat output/apply_digest.txt)"

          gh pr create --base "$BASE" --head "$BR" --title "$TITLE" --body "$BODY" 2>/dev/null || \
          gh pr edit "$BR" --title "$TITLE" --body "$BODY"

      - name: Label PR (ai-live)
        if: ${{ steps.replay.outputs.skip != 'true' && steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          BR="ai-live/issue-${ISSUE}"
          gh pr edit "$BR" --add-label "ai-live" || true

      - name: Enable auto-merge (squash) + delete branch
        if: ${{ steps.replay.outputs.skip != 'true' && steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          BR="ai-live/issue-${ISSUE}"

          MERGED_AT="$(gh pr view "$BR" --json mergedAt -q .mergedAt || true)"
          if [ -n "${MERGED_AT}" ] && [ "${MERGED_AT}" != "null" ]; then
            echo "PR already merged at ${MERGED_AT} -> ok"
            exit 0
          fi

          set +e
          gh pr merge "$BR" --auto --squash --delete-branch
          RC=$?
          set -e

          if [ $RC -eq 0 ]; then
            echo "OK: auto-merge enabled"
            exit 0
          fi

          AM_STATE="$(gh pr view "$BR" --json autoMergeRequest -q '.autoMergeRequest != null' || true)"
          MERGED_AT2="$(gh pr view "$BR" --json mergedAt -q .mergedAt || true)"

          if [ -n "${MERGED_AT2}" ] && [ "${MERGED_AT2}" != "null" ]; then
            echo "PR got merged meanwhile -> ok"
            exit 0
          fi

          if [ "$AM_STATE" = "true" ]; then
            echo "Auto-merge already enabled -> ok"
            exit 0
          fi

          echo "ERROR: failed to enable auto-merge (and it is not enabled)."
          exit 1
