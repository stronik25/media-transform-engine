name: Apply LIVE DEV (by run_id)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: AI Debug run_id that contains artifact live-dev
        required: true
        type: string
      issue:
        description: Issue number (e.g. 1)
        required: true
        type: string
      base_branch:
        description: Base branch
        required: true
        default: main
        type: string
      dry_run:
        description: Validate only (no branch / PR)
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.dry_run && '' || 'live-apply' }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact live-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf apply_ready
          mkdir -p apply_ready
          gh run download "${{ inputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "live-dev" \
            --dir apply_ready
          echo "Downloaded tree:"
          find apply_ready -maxdepth 4 -type f -print

      - name: Validate artifact
        run: |
          set -euo pipefail
          FILE="apply_ready/.ai/dev/issue_${{ inputs.issue }}.md"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: missing $FILE"
            find apply_ready -type f -print
            exit 1
          fi

      - name: Stop after validation (dry_run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true -> stopping"
          exit 0

      - name: Apply artifact into repo
        run: |
          set -euo pipefail
          mkdir -p .ai/dev
          cp "apply_ready/.ai/dev/issue_${{ inputs.issue }}.md" ".ai/dev/"

      - name: Create branch, commit, push (or detect no changes)
        id: push
        run: |
          set -euo pipefail
          BR="ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}"
          git checkout -B "$BR"

          git add .ai/dev
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "apply-live: issue #${{ inputs.issue }} from run ${{ inputs.run_id }}"
          git push -f origin "$BR"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Open PR (only if changes exist)
        if: ${{ steps.push.outputs.no_changes == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${{ steps.push.outputs.branch }}" \
            --base "${{ inputs.base_branch }}" \
            --title "ai-live: issue #${{ inputs.issue }} (run ${{ inputs.run_id }})" \
            --body "Apply LIVE DEV artifact from run ${{ inputs.run_id }}."

      - name: Comment back to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ inputs.issue }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Apply LIVE DEV finished for run ${{ inputs.run_id }} (dry_run=${{ inputs.dry_run }})."
