name: "Apply LIVE DEV artifact (manual, by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug workflow run_id to fetch artifact live-dev from"
        required: true
        default: ""
      issue:
        description: "Issue number (e.g. 1). Used for expected filename and branch naming."
        required: true
        default: "1"
      base_branch:
        description: "Base branch for PR (usually main)."
        required: true
        default: "main"
      dry_run:
        description: "If true: validate only, do not push branch or create PR."
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  ARTIFACT_NAME: "live-dev"
  OUT_DIR: "output/apply"
  DEV_DIR: ".ai/dev"

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Validate inputs"
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 -c "import os,sys,re; rid=os.environ['RUN_ID'].strip(); iss=os.environ['ISSUE'].strip(); base=os.environ['BASE'].strip(); \
          (re.fullmatch(r'[0-9]{6,}', rid) or sys.exit('run_id must be digits')); \
          (re.fullmatch(r'[0-9]+', iss) or sys.exit('issue must be digits')); \
          (re.fullmatch(r'[A-Za-z0-9._/-]+', base) or sys.exit('base_branch has invalid chars')); \
          print('OK inputs:', rid, iss, base, 'dry_run='+os.environ['DRY'])"

      - name: "Download LIVE DEV artifact from run_id"
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUT_DIR }}/live-dev
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}

      - name: "Validate artifact contents"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          ls -la "${OUT_DIR}/live-dev"
          test -f "${OUT_DIR}/live-dev/issue_${ISSUE}.md"

      - name: "Compute digest (traceability)"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          sha256sum "${OUT_DIR}/live-dev/issue_${ISSUE}.md" | awk '{print $1}' > "${OUT_DIR}/apply_digest.txt"
          printf "run_id=%s\nissue=%s\nsha256=%s\n" "${RUN_ID}" "${ISSUE}" "$(cat "${OUT_DIR}/apply_digest.txt")" > "${OUT_DIR}/apply_report.txt"
          cat "${OUT_DIR}/apply_report.txt"

      - name: "Stage into repo working tree"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p "${DEV_DIR}"
          cp "${OUT_DIR}/live-dev/issue_${ISSUE}.md" "${DEV_DIR}/issue_${ISSUE}.md"
          mkdir -p "output"
          cp "${OUT_DIR}/apply_digest.txt" "output/apply_digest.txt"

      - name: "Dry-run stop (no push / no PR)"
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DRY RUN: validated + staged only. No git push, no PR."

      - name: "Commit branch"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BR}"
          git add "${DEV_DIR}" "output/apply_digest.txt"
          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}" || true
          git push -u origin "${BR}" --force

      - name: "Create PR"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          TITLE="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          BODY="Apply LIVE DEV artifact '${ARTIFACT_NAME}' from workflow run ${RUN_ID}. Includes sha256 digest in output/apply_digest.txt."
          gh pr create --base "${BASE}" --head "${BR}" --title "${TITLE}" --body "${BODY}" 2>/dev/null || \
          gh pr edit "${BR}" --title "${TITLE}" --body "${BODY}"
