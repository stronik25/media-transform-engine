name: "AUTO: Apply LIVE DEV when AI Debug requests apply_live=true"

on:
  workflow_run:
    workflows:
      - "AI Debug (v5 gates; v4 deterministic default)"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  auto_apply:
    # Только если AI Debug завершился успехом
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Decide + Dispatch Apply LIVE DEV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # файл workflow Apply (у тебя он apply-live.yml)
          APPLY_WORKFLOW_FILE: "apply-live.yml"
          BASE_BRANCH: "main"
        run: |
          set -euo pipefail

          echo "AI Debug run_id: ${RUN_ID}"

          # 1) Скачаем preflight-out и проверим, что apply_live действительно был запросен
          rm -rf _auto_ctx
          mkdir -p _auto_ctx/preflight _auto_ctx/context

          gh run download "${RUN_ID}" --repo "${OWNER}/${REPO}" --name "preflight-out" --dir "_auto_ctx/preflight" >/dev/null

          SUMMARY_FILE="$(find _auto_ctx/preflight -type f -name summary.txt | head -n 1 || true)"
          if [ -z "${SUMMARY_FILE}" ]; then
            echo "AUTO-APPLY: preflight summary.txt not found -> skip"
            exit 0
          fi

          echo "Found preflight summary: ${SUMMARY_FILE}"
          cat "${SUMMARY_FILE}"

          # Ищем apply_live_input_norm=true (это пишет твой AI Debug preflight)
          if ! grep -Eq '^apply_live_input_norm=true$' "${SUMMARY_FILE}"; then
            echo "AUTO-APPLY: apply_live_input_norm!=true -> skip"
            exit 0
          fi

          # 2) Получим номер issue из ai-debug-context (issue.json.number)
          gh run download "${RUN_ID}" --repo "${OWNER}/${REPO}" --name "ai-debug-context" --dir "_auto_ctx/context" >/dev/null

          ISSUE_JSON="$(find _auto_ctx/context -type f -name issue.json | head -n 1 || true)"
          if [ -z "${ISSUE_JSON}" ]; then
            echo "AUTO-APPLY: issue.json not found -> skip"
            exit 0
          fi

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null

          ISSUE_NUM="$(jq -r '.number // empty' "${ISSUE_JSON}")"
          if [ -z "${ISSUE_NUM}" ]; then
            echo "AUTO-APPLY: could not parse issue number -> skip"
            exit 0
          fi

          echo "AUTO-APPLY: will dispatch Apply for issue=${ISSUE_NUM}, run_id=${RUN_ID}"

          # 3) Диспетчим Apply LIVE DEV (он сам попросит approve через environment live-apply)
          gh workflow run "${APPLY_WORKFLOW_FILE}" \
            --repo "${OWNER}/${REPO}" \
            -f run_id="${RUN_ID}" \
            -f issue="${ISSUE_NUM}" \
            -f base_branch="${BASE_BRANCH}" \
            -f dry_run=false

          echo "AUTO-APPLY: dispatched apply-live.yml"
