name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact apply_ready
          mkdir -p _live_dev_artifact

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded artifact tree:"
          find _live_dev_artifact -maxdepth 4 -type f -print

      - name: Validate + normalize artifact contents (produce apply_ready/)
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          rm -rf apply_ready
          mkdir -p apply_ready/.ai/dev apply_ready/output

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Tree:" >&2
            find _live_dev_artifact -maxdepth 6 -type f -print >&2 || true
            exit 11
          fi

          cp -f "${found}" "apply_ready/.ai/dev/${want}"

          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "apply_ready/response.json"; fi

          digest_inputs="apply_ready/.ai/dev/${want}"
          [ -f "apply_ready/request.json" ] && digest_inputs="${digest_inputs} apply_ready/request.json"
          [ -f "apply_ready/response.json" ] && digest_inputs="${digest_inputs} apply_ready/response.json"

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > apply_ready/output/apply_digest.txt
          echo "apply_digest: ${digest}"

          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print

      - name: Upload normalized artifact (apply-ready)
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: apply_ready
          if-no-files-found: error

  dry_run_done:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Dry run done
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validate completed, no apply/PR steps executed."

  apply:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ inputs.dry_run == false }}

    # IMPORTANT: this job is what should be gated by environment approvals
    environment: live-apply

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download apply-ready artifact
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Show apply-ready tree
        shell: bash
        run: |
          set -euo pipefail
          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          want="apply_ready/.ai/dev/issue_${ISSUE}.md"
          if [ ! -f "${want}" ]; then
            echo "ERROR: expected file missing: ${want}" >&2
            find apply_ready -maxdepth 6 -type f -print >&2 || true
            exit 31
          fi

          mkdir -p .ai/dev
          cp -f "${want}" ".ai/dev/issue_${ISSUE}.md"

          # Optional traces:
          if [ -f "apply_ready/request.json" ]; then
            cp -f "apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"
          fi
          if [ -f "apply_ready/response.json" ]; then
            cp -f "apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"
          fi

          # keep digest in repo under output/
          mkdir -p output
          cp -f "apply_ready/output/apply_digest.txt" "output/apply_digest.txt"

          git status --porcelain

      - name: Create branch + commit + push
        id: push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git checkout -B "${BR}"

          git add .ai/dev output || true

          if git diff --cached --quiet; then
            echo "No changes vs base. Nothing to commit/push."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=${BR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch=${BR}" >> "$GITHUB_OUTPUT"

      - name: Open PR (or reuse existing) (skip if no diff)
        id: pr
        if: ${{ steps.push.outputs.no_changes == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest: see output/apply_digest.txt."

          # Reuse if already exists
          existing="$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json url -q '.[0].url' || true)"
          if [ -n "${existing}" ]; then
            echo "Reusing existing PR: ${existing}"
            echo "pr_url=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create PR
          set +e
          created="$(gh pr create --head "${BRANCH}" --base "${BASE}" --title "${title}" --body "${body}" 2>&1)"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            echo "ERROR: PR create failed. Output:" >&2
            echo "${created}" >&2
            exit 20
          fi

          # gh prints URL; take last token that looks like https://...
          url="$(printf '%s\n' "${created}" | awk '/^https:\/\//{print $1}' | tail -n 1)"
          if [ -z "${url}" ]; then
            echo "ERROR: PR created but URL not parsed. Output:" >&2
            echo "${created}" >&2
            exit 21
          fi

          echo "Opened PR: ${url}"
          echo "pr_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment back to issue (always)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.push.outputs.branch }}
          NO_CHANGES: ${{ steps.push.outputs.no_changes }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          if [ "${NO_CHANGES}" = "true" ]; then
            msg="LIVE DEV apply: no changes vs ${BASE} for branch ${BRANCH} (run_id=${RUN_ID}). PR not created."
          else
            msg="Created/updated PR for LIVE DEV apply: ${PR_URL} (run_id=${RUN_ID})."
          fi

          gh issue comment "${ISSUE}" --body "${msg}"
