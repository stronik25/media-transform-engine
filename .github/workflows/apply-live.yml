name: "Apply LIVE DEV artifact (manual, by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id (from URL /actions/runs/<id>, NOT the #run number)."
        required: true
        default: "0"
      issue:
        description: "Issue number (e.g. 1). Used for expected filename and branch naming."
        required: true
        default: "1"
      target_base:
        description: "Base branch for PR (usually main)."
        required: true
        default: "main"
      dry_run:
        description: "If true: validate only, do not push branch or create PR."
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  ARTIFACT_NAME: "live-dev"
  OUTPUT_DIR: "output"
  LIVE_DIR: "output/live/dev"
  DEV_DIR: ".ai/dev"
  BRANCH_PREFIX: "ai-live/issue-"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: "Validate inputs (strict)"
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.target_base }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          die() { echo "ERROR: $1" >&2; exit 2; }

          r="$(printf "%s" "${RUN_ID}" | tr -d '[:space:]')"
          i="$(printf "%s" "${ISSUE}" | tr -d '[:space:]')"
          b="$(printf "%s" "${BASE}" | tr -d '[:space:]')"

          [ -n "$r" ] || die "run_id is required"
          [ -n "$i" ] || die "issue is required"
          [ -n "$b" ] || die "target_base is required"

          printf "%s" "$r" | grep -Eq '^[0-9]+$' || die "run_id must be numeric, got: ${RUN_ID}"
          printf "%s" "$i" | grep -Eq '^[0-9]+$' || die "issue must be numeric, got: ${ISSUE}"

          [ "$r" -gt 0 ] || die "run_id must be > 0"
          [ "$i" -gt 0 ] || die "issue must be > 0"

          echo "OK: inputs validated"
          echo "run_id=$r"
          echo "issue=$i"
          echo "base=$b"
          echo "dry_run=$DRY"

      - name: "List artifacts for run_id (debug)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${{ env.OUTPUT_DIR }}"

          url="https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100"
          echo "Fetching artifacts list: $url"

          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "$url" > "${{ env.OUTPUT_DIR }}/artifacts.json"

          echo "Artifacts JSON saved to ${{ env.OUTPUT_DIR }}/artifacts.json"
          echo "Artifacts summary:"
          python3 -c "import json; d=json.load(open('${{ env.OUTPUT_DIR }}/artifacts.json','r',encoding='utf-8')); a=d.get('artifacts',[]); print('count=',len(a)); [print('-',x.get('name'), 'id=',x.get('id'), 'expired=',x.get('expired')) for x in a]"

          # Fail fast if artifact name missing
          python3 -c "import json,sys; d=json.load(open('${{ env.OUTPUT_DIR }}/artifacts.json','r',encoding='utf-8')); names=[x.get('name') for x in d.get('artifacts',[])]; sys.exit(0 if '${{ env.ARTIFACT_NAME }}' in names else 6)" || {
            echo "ERROR: artifact '${{ env.ARTIFACT_NAME }}' not found for run_id=${RUN_ID}." >&2
            echo "Hint: run_id must be the long number from /actions/runs/<id>, not the #run number." >&2
            exit 6
          }

      - name: "Checkout base branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_base }}
          fetch-depth: 0

      - name: "Download LIVE DEV artifact from run_id"
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.LIVE_DIR }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: "Verify artifact contents"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          echo "Listing downloaded artifact:"
          ls -la "${{ env.LIVE_DIR }}" || true

          FILE="${{ env.LIVE_DIR }}/issue_${ISSUE}.md"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: expected file missing: $FILE" >&2
            echo "Found files:" >&2
            find "${{ env.LIVE_DIR }}" -maxdepth 3 -type f -print >&2 || true
            exit 3
          fi

          if [ ! -s "$FILE" ]; then
            echo "ERROR: expected file is empty: $FILE" >&2
            exit 4
          fi

          echo "OK: artifact file present and non-empty: $FILE"

      - name: "Stage into repo (.ai/dev)"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p "${{ env.DEV_DIR }}"
          SRC="${{ env.LIVE_DIR }}/issue_${ISSUE}.md"
          DST="${{ env.DEV_DIR }}/issue_${ISSUE}.md"
          cp "$SRC" "$DST"
          echo "Staged: $DST"

      - name: "Compute digest (traceability)"
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p "${{ env.OUTPUT_DIR }}"
          f="${{ env.DEV_DIR }}/issue_${ISSUE}.md"
          sha256sum "$f" | tee "${{ env.OUTPUT_DIR }}/apply_digest.txt"
          echo "Digest saved to ${{ env.OUTPUT_DIR }}/apply_digest.txt"

      - name: "Create branch + commit"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          BR="${{ env.BRANCH_PREFIX }}${ISSUE}-run-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add "${{ env.DEV_DIR }}/issue_${ISSUE}.md" "${{ env.OUTPUT_DIR }}/apply_digest.txt"
          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}" || true
          git push -u origin "$BR" --force

      - name: "Create/Update PR"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.target_base }}
        run: |
          set -euo pipefail
          BR="${{ env.BRANCH_PREFIX }}${ISSUE}-run-${RUN_ID}"
          TITLE="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          BODY="Apply LIVE DEV artifact '${{ env.ARTIFACT_NAME }}' from workflow run ${RUN_ID}. Includes sha256 digest for traceability."

          gh pr create --base "$BASE" --head "$BR" --title "$TITLE" --body "$BODY" 2>/dev/null || \
          gh pr edit "$BR" --title "$TITLE" --body "$BODY"

      - name: "Upload apply report artifact (always)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-live-report
          path: ${{ env.OUTPUT_DIR }}
