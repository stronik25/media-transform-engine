name: "Apply LIVE DEV artifact (manual, by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug workflow run id that produced artifact 'live-dev' (e.g. 21536204217)"
        required: true
        default: ""
      issue:
        description: "Issue number (e.g. 1). Used for expected filename and branch naming."
        required: true
        default: "1"
      base_branch:
        description: "Base branch for PR (usually main)."
        required: true
        default: "main"
      dry_run:
        description: "If true: validate only, do not push branch or create PR."
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  ARTIFACT_NAME: "live-dev"
  OUTPUT_DIR: "output"
  BRANCH_PREFIX: "ai-live/issue-"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download LIVE DEV artifact from run_id"
        uses: actions/download-artifact@v4
        with:
          # IMPORTANT: download from a DIFFERENT workflow run
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}/live-dev

      - name: "Validate artifact contents"
        shell: bash
        run: |
          set -euo pipefail
          ls -la "${OUTPUT_DIR}/live-dev"
          test -f "${OUTPUT_DIR}/live-dev/issue_${{ inputs.issue }}.md" || {
            echo "Missing expected file: ${OUTPUT_DIR}/live-dev/issue_${{ inputs.issue }}.md" >&2
            echo "Files present:" >&2
            find "${OUTPUT_DIR}/live-dev" -maxdepth 2 -type f -print >&2
            exit 2
          }
          echo "OK: expected issue markdown exists"

      - name: "Materialize into repo (.ai/dev)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ai/dev
          cp -f "${OUTPUT_DIR}/live-dev/issue_${{ inputs.issue }}.md" ".ai/dev/issue_${{ inputs.issue }}.md"

          # Optional traceability file if exists in artifact
          if [ -f "${OUTPUT_DIR}/live-dev/response.json" ]; then
            mkdir -p "${OUTPUT_DIR}"
            sha256sum "${OUTPUT_DIR}/live-dev/response.json" | awk '{print $1}' > "${OUTPUT_DIR}/apply_digest.txt"
          else
            echo "no-response-json" > "${OUTPUT_DIR}/apply_digest.txt"
          fi

      - name: "Stop if dry_run=true"
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DRY RUN: validated and staged files, but will not push/PR."
          echo "Staged file: .ai/dev/issue_${{ inputs.issue }}.md"
          exit 0

      - name: "Commit to branch"
        shell: bash
        run: |
          set -euo pipefail
          BR="${BRANCH_PREFIX}${{ inputs.issue }}-run-${{ inputs.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BR"
          git add .ai/dev "${OUTPUT_DIR}/apply_digest.txt" || true
          git commit -m "apply-live: issue #${{ inputs.issue }} from run ${{ inputs.run_id }}" || true
          git push -u origin "$BR" --force

      - name: "Create/Update PR"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${BRANCH_PREFIX}${{ inputs.issue }}-run-${{ inputs.run_id }}"
          BASE="${{ inputs.base_branch }}"
          TITLE="ai-live: issue #${{ inputs.issue }} (run ${{ inputs.run_id }})"
          BODY="Apply LIVE DEV artifact '${ARTIFACT_NAME}' from workflow run ${{ inputs.run_id }}. Includes digest for traceability."

          gh pr create --base "$BASE" --head "$BR" --title "$TITLE" --body "$BODY" 2>/dev/null || \
          gh pr edit "$BR" --title "$TITLE" --body "$BODY"
