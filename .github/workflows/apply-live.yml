name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: false
        default: "main"
        type: string
      dry_run:
        description: "If true: validate only, do not commit or open PR"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest
    environment: live-apply

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Download LIVE DEV artifact
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: _live_dev_artifact

      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f "_live_dev_artifact/issue_${{ inputs.issue }}.md"
          test -f "_live_dev_artifact/request.json"
          test -f "_live_dev_artifact/response.json"

          mkdir -p output

          digest="$(
            (cd _live_dev_artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            | sha256sum | awk '{print $1}'
          )"

          echo "${digest}" > output/apply_digest.txt

      - name: Stop after validation
        if: ${{ inputs.dry_run == true }}
        run: echo "dry_run=true → validation OK"

      - name: Apply artifact to repo
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --checksum _live_dev_artifact/ ./

      - name: Create branch and commit
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BR}"
          git add -A
          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push --force-with-lease origin "${BR}"

      - name: Open PR
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          python3 - <<PY
import json, urllib.request

url = f"https://api.github.com/repos/{OWNER}/{REPO}/pulls"
payload = {
  "title": f"ai-live: issue #{ISSUE} (run {RUN_ID})",
  "head": f"ai-live/issue-{ISSUE}-run-{RUN_ID}",
  "base": BASE,
  "body": f"Apply LIVE DEV artifact from run {RUN_ID}. Digest in output/apply_digest.txt"
}

req = urllib.request.Request(
  url,
  data=json.dumps(payload).encode(),
  headers={
    "Authorization": f"Bearer {GH_TOKEN}",
    "Accept": "application/vnd.github+json"
  },
  method="POST"
)

urllib.request.urlopen(req)
PY
