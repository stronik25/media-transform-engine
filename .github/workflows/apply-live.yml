name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch / PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest

    environment: ${{ inputs.dry_run && '' || 'live-apply' }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact live-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apply_ready
          gh run download "${{ inputs.run_id }}" \
            --name live-dev \
            --dir apply_ready

      - name: Validate artifact
        run: |
          set -euo pipefail
          FILE="apply_ready/.ai/dev/issue_${{ inputs.issue }}.md"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: missing $FILE"
            find apply_ready -type f
            exit 1
          fi

      - name: Stop after validation (dry_run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true → stopping"
          exit 0

      - name: Apply artifact into repo
        run: |
          set -euo pipefail
          mkdir -p .ai/dev
          cp apply_ready/.ai/dev/issue_${{ inputs.issue }}.md .ai/dev/

      - name: Create branch and commit
        id: commit
        run: |
          set -euo pipefail
          BR="ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}"
          git checkout -B "$BR"
          git add .ai/dev

          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "apply-live: issue #${{ inputs.issue }} from run ${{ inputs.run_id }}"
          git push -f origin "$BR"

          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: ${{ steps.commit.outputs.no_changes == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --head "${{ steps.commit.outputs.branch }}" \
            --base "${{ inputs.base_branch }}" \
            --title "ai-live: issue #${{ inputs.issue }} (run ${{ inputs.run_id }})" \
            --body "Apply LIVE DEV artifact from run ${{ inputs.run_id }}."

      - name: Comment back to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ inputs.issue }}" \
            --body "Apply LIVE DEV finished for run ${{ inputs.run_id }}."
