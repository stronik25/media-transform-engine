name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact 'live-dev'"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1). Used for expected filename and branch naming."
        required: true
        type: string
      base_branch:
        description: "Base branch for PR (usually main)."
        required: true
        default: "main"
        type: string
      dry_run:
        description: "If true: validate only, do not push branch or create PR."
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: apply-live-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Download LIVE DEV artifact from run_id
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          path: _live_dev_artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate artifact contents
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing _live_dev_artifact:"
          ls -la _live_dev_artifact || true
          echo "Tree:"
          find _live_dev_artifact -maxdepth 4 -type f -print || true

          ISSUE_FILE="_live_dev_artifact/.ai/dev/issue_${{ inputs.issue }}.md"
          DIGEST_FILE="_live_dev_artifact/output/apply_digest.txt"

          if [ ! -f "${ISSUE_FILE}" ]; then
            echo "ERROR: missing ${ISSUE_FILE}" >&2
            exit 11
          fi

          if [ ! -f "${DIGEST_FILE}" ]; then
            echo "ERROR: missing ${DIGEST_FILE}" >&2
            exit 12
          fi

          digest="$(tr -d ' \r\n\t' < "${DIGEST_FILE}" | head -c 128)"
          if ! printf "%s" "${digest}" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "ERROR: apply_digest.txt must be a 64-hex sha256. Got: ${digest}" >&2
            exit 13
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "OK: digest=${digest}"

      - name: Stop after validation (dry_run=true)
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validated only. No branch/PR created."

      - name: Apply artifact into repo working tree
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          # safety: only allow these paths to be applied
          rm -rf .ai output || true
          mkdir -p .ai output

          rsync -a --delete "_live_dev_artifact/.ai/" ".ai/"
          rsync -a --delete "_live_dev_artifact/output/" "output/"

          echo "Applied files:"
          git status --porcelain

          # extra safety check: refuse unexpected paths
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(\.ai/|output/)' || true)"
          if [ -n "${bad}" ]; then
            echo "ERROR: unexpected paths would be committed:" >&2
            echo "${bad}" >&2
            exit 21
          fi

      - name: Create branch + commit + push
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          BRANCH: ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"

          git add .ai output
          if git diff --cached --quiet; then
            echo "ERROR: nothing to commit (artifact applied but no changes staged?)" >&2
            exit 31
          fi

          git commit -m "apply-live: issue #${{ inputs.issue }} from run ${{ inputs.run_id }}"
          git push -f origin "${BRANCH}"

      - name: Open PR
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
          DIGEST: ${{ steps.validate.outputs.digest }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${{ inputs.issue }} (run ${{ inputs.run_id }})"
          body="Apply LIVE DEV artifact 'live-dev' from run ${{ inputs.run_id }}.\n\ndigest: ${DIGEST}\n"

          # create PR (idempotent-ish: if exists, gh will fail -> print existing)
          if gh pr create --base "${BASE}" --head "${BRANCH}" --title "${title}" --body "${body}"; then
            echo "PR created."
          else
            echo "PR create failed (maybe already exists). Listing PRs for branch:"
            gh pr list --head "${BRANCH}" --state open || true
            exit 0
          fi
