name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "true = validate only (no push/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  ARTIFACT_NAME: live-dev

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact (live-dev) from run_id
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ inputs.run_id }}
          path: _incoming/live-dev

      - name: Block apply if artifact is an error payload
        shell: bash
        run: |
          set -euo pipefail
          test -d "_incoming/live-dev" || (echo "missing _incoming/live-dev" && exit 2)
          if grep -RInE --binary-files=without-match '(insufficient_quota|You exceeded your current quota|"error"[[:space:]]*:)' "_incoming/live-dev" >/dev/null 2>&1; then
            echo "ERROR: live-dev contains error payload (quota/error)."
            grep -RInE --binary-files=without-match '(insufficient_quota|You exceeded your current quota|"error"[[:space:]]*:)' "_incoming/live-dev" || true
            exit 10
          fi

      - name: Compute digest + write apply record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output .ai/dev
          find _incoming/live-dev -type f -print0 | sort -z | xargs -0 sha256sum > output/_files.sha256
          sha256sum output/_files.sha256 | awk '{print $1}' > output/apply_digest.txt
          {
            echo "# LIVE DEV apply record"
            echo ""
            echo "- issue: ${{ inputs.issue }}"
            echo "- run_id: ${{ inputs.run_id }}"
            echo "- digest: $(cat output/apply_digest.txt)"
            echo "- applied_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > ".ai/dev/issue_${{ inputs.issue }}.md"

      - name: Apply allowlist (safe)
        shell: bash
        run: |
          set -euo pipefail
          # apply only these folders if present
          if [ -d "_incoming/live-dev/.ai/dev" ]; then
            mkdir -p .ai/dev
            rsync -a --delete --exclude 'issue_*.md' "_incoming/live-dev/.ai/dev/" ".ai/dev/"
          fi
          if [ -d "_incoming/live-dev/output" ]; then
            mkdir -p output
            rsync -a --delete "_incoming/live-dev/output/" "output/"
          fi
          rm -rf _incoming

      - name: Dry run status
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true → no push/PR"
          git status --porcelain || true

      - name: Commit + push branch
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          BRANCH: ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}
        run: |
          set -euo pipefail
          git checkout -b "$BRANCH"
          git add -A .ai/dev output/apply_digest.txt output || true
          git diff --cached --quiet && (echo "Nothing to commit" && exit 0)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "apply-live: issue #${{ inputs.issue }} from run ${{ inputs.run_id }}"
          git push -u origin "$BRANCH"

      - name: Create PR
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ai-live/issue-${{ inputs.issue }}-run-${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          title="ai-live: issue #${{ inputs.issue }} (run ${{ inputs.run_id }})"
          body="Apply LIVE DEV artifact '${ARTIFACT_NAME}' from run ${{ inputs.run_id }}.
digest: $(cat output/apply_digest.txt)"
          gh api repos/${{ github.repository }}/pulls \
            -f title="$title" \
            -f head="$BRANCH" \
            -f base="$BASE" \
            -f body="$body" >/dev/null
          echo "PR created"
