name: "Apply LIVE artifact -> PR (manual by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id to pull artifacts from (number)"
        required: true
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        default: "1"

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  LIVE_BRANCH_PREFIX: ai-live/issue-
  ARTIFACT_NAME: live-dev

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download LIVE DEV artifact via gh (by run_id)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.to_
