name: Apply LIVE DEV (by run_id)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest

    # only require approval when actually applying
    environment: ${{ inputs.dry_run && '' || 'live-apply' }}

    concurrency:
      group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
      cancel-in-progress: true

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact live-dev from AI Debug run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact _live_dev_artifact_norm output
          mkdir -p _live_dev_artifact output

          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded tree:"
          find _live_dev_artifact -maxdepth 6 -type f -print

      - name: Validate + normalize artifact contents
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          mkdir -p _live_dev_artifact_norm/.ai/dev

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            find _live_dev_artifact -maxdepth 10 -type f -print >&2 || true
            exit 11
          fi

          cp -f "${found}" "_live_dev_artifact_norm/.ai/dev/${want}"

          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "_live_dev_artifact_norm/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "_live_dev_artifact_norm/response.json"; fi

          echo "Normalized files:"
          find _live_dev_artifact_norm -maxdepth 6 -type f -print

          digest_inputs="_live_dev_artifact_norm/.ai/dev/${want}"
          if [ -f "_live_dev_artifact_norm/request.json" ]; then digest_inputs="${digest_inputs} _live_dev_artifact_norm/request.json"; fi
          if [ -f "_live_dev_artifact_norm/response.json" ]; then digest_inputs="${digest_inputs} _live_dev_artifact_norm/response.json"; fi

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > output/apply_digest.txt
          echo "apply_digest: ${digest}"

      - name: Stop after validation (dry_run=true)
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> stopping after validation"
          exit 0

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          mkdir -p .ai/dev
          cp -f "_live_dev_artifact_norm/.ai/dev/issue_${ISSUE}.md" ".ai/dev/issue_${ISSUE}.md"

          # Optional trace files
          if [ -f "_live_dev_artifact_norm/request.json" ]; then
            cp -f "_live_dev_artifact_norm/request.json" ".ai/dev/request_${ISSUE}.json"
          fi
          if [ -f "_live_dev_artifact_norm/response.json" ]; then
            cp -f "_live_dev_artifact_norm/response.json" ".ai/dev/response_${ISSUE}.json"
          fi

          test -f output/apply_digest.txt
          git status --porcelain

      - name: Create branch + commit + push (or mark no_changes)
        id: push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git checkout -B "${BR}"

          git add .ai/dev output || true

          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=${BR}" >> "$GITHUB_OUTPUT"
            echo "No changes vs working tree."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch=${BR}" >> "$GITHUB_OUTPUT"

      - name: Diffcheck (commits between base and branch)
        id: diffcheck
        if: ${{ steps.push.outputs.no_changes == 'false' }}
        shell: bash
        env:
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE}:${BASE}" --force
          git fetch origin "${BRANCH}:${BRANCH}" --force

          cnt="$(git rev-list --count "${BASE}..${BRANCH}")"
          echo "commits_between=${cnt}"
          echo "commits_between=${cnt}" >> "$GITHUB_OUTPUT"

      - name: Open PR (or reuse existing)
        id: pr
        if: ${{ steps.push.outputs.no_changes == 'false' && steps.diffcheck.outputs.commits_between != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest: see output/apply_digest.txt."

          existing_url="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json url --jq '.[0].url // ""')"
          if [ -n "${existing_url}" ]; then
            echo "Reusing existing PR: ${existing_url}"
            echo "url=${existing_url}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --base "${BASE}" \
            --title "${title}" \
            --body "${body}")"

          echo "Opened PR: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment back to issue (always)
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          DRY: ${{ inputs.dry_run }}
          NO_CHANGES: ${{ steps.push.outputs.no_changes }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail

          msg="Apply LIVE DEV finished (run_id=${RUN_ID}, dry_run=${DRY})."
          if [ "${NO_CHANGES}" = "true" ]; then
            msg="${msg} No changes -> no PR."
          else
            if [ -n "${PR_URL}" ]; then
              msg="${msg} PR: ${PR_URL}"
            else
              msg="${msg} No PR opened (0 commits vs base)."
            fi
          fi

          gh issue comment "${ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "${msg}"
