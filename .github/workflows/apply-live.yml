name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact 'live-dev'"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: false
        default: "main"
        type: string
      dry_run:
        description: "If true: validate only, do not commit/PR"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest
    environment: live-apply

    steps:
      - name: "Checkout base branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: "Download LIVE DEV artifact from run_id"
        uses: actions/download-artifact@v4
        with:
          name: live-dev
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: _live_dev_artifact

      - name: "Validate + normalize artifact contents"
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing artifact dir:"
          ls -la _live_dev_artifact || true
          echo "Tree:"
          find _live_dev_artifact -maxdepth 3 -type f -print || true

          # Must contain these files (as produced by ai-debug-3agents.yml)
          test -f "_live_dev_artifact/issue_${{ inputs.issue }}.md" \
            || { echo "ERROR: missing _live_dev_artifact/issue_${{ inputs.issue }}.md" >&2; exit 11; }
          test -f "_live_dev_artifact/request.json" \
            || { echo "ERROR: missing _live_dev_artifact/request.json" >&2; exit 11; }
          test -f "_live_dev_artifact/response.json" \
            || { echo "ERROR: missing _live_dev_artifact/response.json" >&2; exit 11; }

          # Make sure output dir exists in repo worktree
          mkdir -p output .ai/dev

          # Compute a stable digest for traceability (based on artifact content)
          digest="$( (cd _live_dev_artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}' )"
          echo "apply_digest=${digest}" | tee output/apply_digest.txt

      - name: "Stop after validation (dry_run=true)"
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validation complete, stopping."

      - name: "Apply artifact into repo working tree"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          # Apply everything from artifact root to repo root (overwrites as needed).
          # This avoids 'cp same file' and keeps paths stable.
          rsync -a --checksum \
            --exclude ".git/" \
            _live_dev_artifact/ ./

          # Ensure digest file remains in output/ (rsync may have overwritten it)
          test -f output/apply_digest.txt

      - name: "Create branch + commit + push"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BR}"

          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: no changes after apply; nothing to commit." >&2
            exit 12
          fi

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push --force-with-lease origin "${BR}"

          echo "branch=${BR}" >> "$GITHUB_OUTPUT"

      - name: "Open PR"
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          head="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from workflow run ${RUN_ID}. Includes digest in output/apply_digest.txt for traceability."

          api="https://api.github.com/repos/${OWNER}/${REPO}/pulls"
          payload="$(python3 - <<'PY'
import json, os
print(json.dumps({
  "title": os.environ["title"] if "title" in os.environ else "",
  "head": os.environ["head"] if "head" in os.environ else "",
  "base": os.environ["BASE"],
  "body": os.environ["body"] if "body" in os.environ else ""
}))
PY
)"
          # inject vars safely (no jq dependency)
          payload="$(python3 - <<PY
import json, os
p = {
  "title": os.environ["TITLE"],
  "head": os.environ["HEAD"],
  "base": os.environ["BASE"],
  "body": os.environ["BODY"],
}
print(json.dumps(p))
PY
)" || true

          # Simpler: build payload directly
          payload="$(python3 - <<PY
import json, os
print(json.dumps({
  "title": f"ai-live: issue #{os.environ['ISSUE']} (run {os.environ['RUN_ID']})",
  "head": f"ai-live/issue-{os.environ['ISSUE']}-run-{os.environ['RUN_ID']}",
  "base": os.environ["BASE"],
  "body": f"Apply LIVE DEV artifact 'live-dev' from workflow run {os.environ['RUN_ID']}. Includes digest in output/apply_digest.txt for traceability."
}))
PY
)"

          code="$(curl -sS -o pr.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}")"

          if [ "${code}" != "201" ]; then
            echo "ERROR: failed to open PR (expected 201). http_code=${code}" >&2
            cat pr.json >&2 || true
            exit 13
          fi

          pr_url="$(python3 -c "import json; print(json.load(open('pr.json'))['html_url'])")"
          echo "PR: ${pr_url}"
