name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean
      qa_enabled:
        description: "Run QA gate before PR (artifact-applied tree only)"
        required: true
        default: true
        type: boolean
      write_digest_history:
        description: "Append record to .ai/dev/digest-history.jsonl"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.normalize.outputs.digest }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_raw _live_dev_norm output
          mkdir -p _live_dev_raw _live_dev_norm/.ai/dev output

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_raw"

      - name: Normalize artifact + write digest
        id: normalize
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          WANT="issue_${ISSUE}.md"
          SRC_MD="$(find _live_dev_raw -type f -name "${WANT}" | head -n 1 || true)"
          test -n "$SRC_MD"

          cp -f "$SRC_MD" "_live_dev_norm/.ai/dev/${WANT}"

          for f in request.json response.json apply_digest.txt; do
            SRC="$(find _live_dev_raw -type f -name "$f" | head -n 1 || true)"
            [ -n "$SRC" ] && cp -f "$SRC" "_live_dev_norm/$f"
          done

          MANIFEST="$(mktemp)"
          trap 'rm -f "$MANIFEST"' EXIT
          sha256sum "_live_dev_norm/.ai/dev/${WANT}" >> "$MANIFEST"
          [ -f "_live_dev_norm/request.json" ] && sha256sum "_live_dev_norm/request.json" >> "$MANIFEST"
          [ -f "_live_dev_norm/response.json" ] && sha256sum "_live_dev_norm/response.json" >> "$MANIFEST"

          DIGEST="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          echo "sha256:${DIGEST}" > output/apply_digest.txt
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload apply-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: |
            _live_dev_norm
            output/apply_digest.txt
          include-hidden-files: true
          retention-days: 7

  dry_run_done:
    if: ${{ inputs.dry_run == true }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - run: echo "dry_run=true → validation OK"

  apply:
    if: ${{ inputs.dry_run == false }}
    needs: validate
    runs-on: ubuntu-latest
    environment: live-apply

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download apply-ready
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Replay guard (GLOBAL + branch)
        id: replay
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          CUR_DIG="$(cat apply_ready/output/apply_digest.txt | tr -d '\r')"
          test "$CUR_DIG" != ""

          GLOBAL=".ai/dev/applied_digests.txt"
          if [ -f "$GLOBAL" ] && grep -Fxq "$CUR_DIG" "$GLOBAL"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stop early (replay)
        if: ${{ steps.replay.outputs.skip == 'true' }}
        run: echo "replay skip"

      - name: Apply artifact
        if: ${{ steps.replay.outputs.skip != 'true' }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          mkdir -p .ai/dev output

          cp -f apply_ready/.ai/dev/issue_${ISSUE}.md .ai/dev/
          cp -f apply_ready/output/apply_digest.txt output/

          cp -f apply_ready/request.json .ai/dev/request_${ISSUE}.json 2>/dev/null || true
          cp -f apply_ready/response.json .ai/dev/response_${ISSUE}.json 2>/dev/null || true

          CUR="$(cat output/apply_digest.txt)"
          echo "$CUR" > .ai/dev/.applied_ok

          touch .ai/dev/applied_digests.txt
          grep -Fxq "$CUR" .ai/dev/applied_digests.txt || echo "$CUR" >> .ai/dev/applied_digests.txt

          [ "${{ inputs.write_digest_history }}" = "true" ] && \
            echo "{\"ts\":\"$(date -u +%FT%TZ)\",\"digest\":\"$CUR\",\"run_id\":\"${{ inputs.run_id }}\"}" >> .ai/dev/digest-history.jsonl

      - name: No-diff guard
        id: nodiff
        shell: bash
        run: |
          git diff --quiet && echo "no_diff=true" >> "$GITHUB_OUTPUT" || echo "no_diff=false" >> "$GITHUB_OUTPUT"

      - name: Stop early (no diff)
        if: ${{ steps.nodiff.outputs.no_diff == 'true' }}
        run: echo "no diff"

      - name: Allowlist guard
        if: ${{ steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        run: |
          BAD="$(git diff --name-only | grep -Ev '^(\.ai/dev/|output/apply_digest\.txt$)' || true)"
          [ -z "$BAD" ] || { echo "$BAD"; exit 61; }

      - name: QA gate (STRICT)
        if: ${{ inputs.qa_enabled == true && steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          test -s ".ai/dev/issue_${ISSUE}.md"
          grep -Eq '^# ' ".ai/dev/issue_${ISSUE}.md"
          grep -Eq '^## Goal' ".ai/dev/issue_${ISSUE}.md"
          grep -Eq '^## Expected' ".ai/dev/issue_${ISSUE}.md"

          test -f ".ai/dev/.applied_ok"
          test -f ".ai/dev/applied_digests.txt"
          test -f "output/apply_digest.txt"

          D="$(cat output/apply_digest.txt)"
          grep -Fxq "$D" ".ai/dev/applied_digests.txt"

          ALLOWED="^\.ai/dev/(issue_${ISSUE}\.md|\.applied_ok|applied_digests\.txt|digest-history\.jsonl|request_${ISSUE}\.json|response_${ISSUE}\.json)$"
          BAD="$(find .ai/dev -type f | grep -Ev "$ALLOWED" || true)"
          [ -z "$BAD" ] || { echo "$BAD"; exit 71; }

          for f in .ai/dev/request_${ISSUE}.json .ai/dev/response_${ISSUE}.json; do
            [ -f "$f" ] && python3 -c 'import json,sys;json.load(open(sys.argv[1]))' "$f"
          done

      - name: Create PR + auto-merge
        if: ${{ steps.nodiff.outputs.no_diff != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          BR="ai-live/issue-${ISSUE}"

          git checkout -B "$BR"
          git add .ai/dev output/apply_digest.txt
          git commit -m "apply live-dev: issue #${ISSUE}" || true
          git push -u origin "$BR" --force

          gh pr create --base main --head "$BR" --title "apply live-dev: issue #${ISSUE}" \
            --body "Applied artifact run_id=${{ inputs.run_id }}" 2>/dev/null || true

          gh pr merge "$BR" --auto --squash --delete-branch
