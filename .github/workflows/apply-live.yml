name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug workflow RUN ID (the long number) that contains artifact 'live-dev'"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest

    concurrency:
      group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}-validate
      cancel-in-progress: true

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact apply_ready
          mkdir -p _live_dev_artifact

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded artifact tree:"
          find _live_dev_artifact -maxdepth 6 -type f -print

      - name: Validate + normalize artifact contents + write digest
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          mkdir -p apply_ready/.ai/dev apply_ready/output

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Tree:" >&2
            find _live_dev_artifact -maxdepth 8 -type f -print >&2 || true
            exit 11
          fi

          cp -f "${found}" "apply_ready/.ai/dev/${want}"

          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "apply_ready/response.json"; fi

          echo "Normalized files:"
          find apply_ready -maxdepth 6 -type f -print

          digest_inputs="apply_ready/.ai/dev/${want}"
          [ -f "apply_ready/request.json" ]  && digest_inputs="${digest_inputs} apply_ready/request.json"
          [ -f "apply_ready/response.json" ] && digest_inputs="${digest_inputs} apply_ready/response.json"

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > apply_ready/output/apply_digest.txt
          echo "apply_digest: ${digest}"

      - name: Upload normalized artifact (apply-ready)
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

  apply:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == false }}

    # IMPORTANT: approval gate is only here (real apply)
    environment: live-apply

    concurrency:
      group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}-apply
      cancel-in-progress: true

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download normalized artifact from validate job
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print

          want="issue_${ISSUE}.md"
          test -f "apply_ready/.ai/dev/${want}"
          test -f "apply_ready/output/apply_digest.txt"

          mkdir -p .ai/dev output

          cp -f "apply_ready/.ai/dev/${want}" ".ai/dev/${want}"
          cp -f "apply_ready/output/apply_digest.txt" "output/apply_digest.txt"

          # Optional trace files:
          if [ -f "apply_ready/request.json" ]; then cp -f "apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"; fi
          if [ -f "apply_ready/response.json" ]; then cp -f "apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"; fi

          echo "Worktree changes:"
          git status --porcelain

      - name: Create branch + commit + push
        id: push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BR}"

          git add .ai/dev output
          if git diff --cached --quiet; then
            echo "No changes to commit. Exiting."
            echo "branch=${BR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "branch=${BR}" >> "$GITHUB_OUTPUT"

      - name: Open PR (or reuse existing)
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
          BR: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest in output/apply_digest.txt."

          # If PR already exists for this head, just print it
          if gh pr view "${BR}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            url="$(gh pr view "${BR}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)"
            echo "PR already exists: ${url}"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE}" \
            --head "${BR}" \
            --title "${title}" \
            --body "${body}")"

          echo "Opened PR: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment back to issue with PR link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Created PR for LIVE DEV apply: ${PR_URL} (run_id=${RUN_ID})"
