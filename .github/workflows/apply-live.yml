name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      issue: ${{ steps.meta.outputs.issue }}
      run_id: ${{ steps.meta.outputs.run_id }}
      base: ${{ steps.meta.outputs.base }}

    steps:
      - name: Resolve inputs
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "issue=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          echo "base=${{ inputs.base_branch }}" >> "$GITHUB_OUTPUT"

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact apply_ready
          mkdir -p _live_dev_artifact apply_ready

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded to _live_dev_artifact"
          find _live_dev_artifact -maxdepth 4 -type f -print

      - name: Validate + normalize -> apply_ready/*
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p apply_ready/.ai/dev apply_ready/output

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Tree:" >&2
            find _live_dev_artifact -maxdepth 8 -type f -print >&2 || true
            exit 11
          fi

          cp -f "${found}" "apply_ready/.ai/dev/${want}"

          # optional trace files
          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "apply_ready/response.json"; fi

          # digest (at least md must exist)
          digest_inputs="apply_ready/.ai/dev/${want}"
          [ -f "apply_ready/request.json" ] && digest_inputs="${digest_inputs} apply_ready/request.json"
          [ -f "apply_ready/response.json" ] && digest_inputs="${digest_inputs} apply_ready/response.json"

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > apply_ready/output/apply_digest.txt

          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print
          echo "apply_digest: ${digest}"

      - name: Upload normalized artifact (apply-ready)
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

  apply:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == false }}

    # IMPORTANT: only require approval when actually applying
    environment: live-apply

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Download normalized artifact from validate job
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          want="apply_ready/.ai/dev/issue_${ISSUE}.md"
          test -f "${want}"

          mkdir -p .ai/dev output
          cp -f "${want}" ".ai/dev/issue_${ISSUE}.md"

          test -f "apply_ready/output/apply_digest.txt"
          cp -f "apply_ready/output/apply_digest.txt" "output/apply_digest.txt"

          # Optional trace files
          if [ -f "apply_ready/request.json" ]; then cp -f "apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"; fi
          if [ -f "apply_ready/response.json" ]; then cp -f "apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"; fi

          git status --porcelain
          test -n "$(git status --porcelain)" || { echo "ERROR: nothing changed after apply"; exit 13; }

      - name: Create branch + commit + push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git checkout -B "${BR}"

          git add .ai/dev output

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "BR=${BR}" >> "$GITHUB_ENV"

      - name: Open PR (or reuse existing)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest in output/apply_digest.txt."
          api="https://api.github.com/repos/${OWNER}/${REPO}/pulls"

          payload="$(jq -n \
            --arg title "$title" \
            --arg head "$BR" \
            --arg base "$BASE" \
            --arg body "$body" \
            '{title:$title, head:$head, base:$base, body:$body}')"

          resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}")"

          url="$(echo "$resp" | jq -r '.html_url // empty')"
          if [ -z "${url}" ]; then
            # if PR already exists, fetch it
            prs_api="https://api.github.com/repos/${OWNER}/${REPO}/pulls?head=${OWNER}:${BR}&state=open"
            prs="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${prs_api}")"
            url="$(echo "$prs" | jq -r '.[0].html_url // empty')"
          fi

          if [ -z "${url}" ]; then
            echo "ERROR: PR create/find failed. Response:" >&2
            echo "${resp}" >&2
            exit 20
          fi

          echo "PR_URL=${url}" >> "$GITHUB_ENV"
          echo "Opened PR: ${url}"

      - name: Comment back to issue with PR link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          msg="Created PR for LIVE DEV apply: ${PR_URL} (run_id=${RUN_ID})"
          api="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments"

          payload="$(jq -n --arg body "$msg" '{body:$body}')"

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}" > /dev/null

  dry_run_done:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Stop after validation (dry_run=true)
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validate OK, nothing applied."
