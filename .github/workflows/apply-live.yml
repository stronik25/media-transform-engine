name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug workflow RUN_ID that contains artifact 'live-dev' (number from /actions/runs/<RUN_ID>)"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.vars.outputs.issue }}
      run_id: ${{ steps.vars.outputs.run_id }}
      base: ${{ steps.vars.outputs.base }}
      branch: ${{ steps.vars.outputs.branch }}
    steps:
      - name: Resolve vars
        id: vars
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "issue=${ISSUE}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "branch=ai-live/issue-${ISSUE}-run-${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact apply_ready
          mkdir -p _live_dev_artifact apply_ready/output

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded live-dev -> _live_dev_artifact"
          find _live_dev_artifact -maxdepth 4 -type f -print

      - name: Validate + normalize artifact contents (non-hidden paths)
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Artifact tree (depth 6):" >&2
            find _live_dev_artifact -maxdepth 6 -type f -print >&2 || true
            exit 11
          fi

          # normalize into NON-hidden dirs so upload/download never drops dot-paths
          mkdir -p apply_ready/ai/dev
          cp -f "${found}" "apply_ready/ai/dev/${want}"

          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "apply_ready/response.json"; fi

          # deterministic digest
          digest_inputs="apply_ready/ai/dev/${want}"
          [ -f "apply_ready/request.json" ]  && digest_inputs="${digest_inputs} apply_ready/request.json"
          [ -f "apply_ready/response.json" ] && digest_inputs="${digest_inputs} apply_ready/response.json"

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > apply_ready/output/apply_digest.txt

          echo "OK normalized:"
          find apply_ready -maxdepth 6 -type f -print
          echo "apply_digest: ${digest}"

      - name: Upload apply-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

  dry_run_done:
    name: dry_run_done
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Done
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validate OK, not applying."

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == false }}
    environment: live-apply
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download normalized artifact from validate job
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print

          want="issue_${ISSUE}.md"
          test -f "apply_ready/ai/dev/${want}" || { echo "ERROR: missing apply_ready/ai/dev/${want}" >&2; exit 21; }
          test -f "apply_ready/output/apply_digest.txt" || { echo "ERROR: missing apply_ready/output/apply_digest.txt" >&2; exit 22; }

          mkdir -p .ai/dev output
          cp -f "apply_ready/ai/dev/${want}" ".ai/dev/${want}"
          cp -f "apply_ready/output/apply_digest.txt" "output/apply_digest.txt"

          # optional trace files
          if [ -f "apply_ready/request.json" ]; then cp -f "apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"; fi
          if [ -f "apply_ready/response.json" ]; then cp -f "apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"; fi

          echo "Working tree status:"
          git status --porcelain

      - name: Create branch + commit + push
        shell: bash
        env:
          BR: ${{ needs.validate.outputs.branch }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
        run: |
          set -euo pipefail

          git checkout -B "${BR}"

          git add .ai/dev output
          if git diff --cached --quiet; then
            echo "No changes to commit. Exiting."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

      - name: Open PR (or reuse existing)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ needs.validate.outputs.branch }}
          BASE: ${{ needs.validate.outputs.base }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest: see output/apply_digest.txt."

          # Try create, if already exists -> find it
          if gh pr create --base "${BASE}" --head "${BR}" --title "${title}" --body "${body}" 2>/dev/null; then
            echo "PR created."
          else
            echo "PR create failed (maybe exists). Searching existing PR..."
          fi

          pr_url="$(gh pr list --head "${BR}" --state open --json url --jq '.[0].url' 2>/dev/null || true)"
          if [ -z "${pr_url}" ]; then
            echo "ERROR: Could not find PR for head ${BR}" >&2
            gh pr list --state open --json url,headRefName --jq '.[] | {url,headRefName}' || true
            exit 30
          fi
          echo "PR: ${pr_url}"

      - name: Comment back to issue with PR link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          BR: ${{ needs.validate.outputs.branch }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
        run: |
          set -euo pipefail

          pr_url="$(gh pr list --head "${BR}" --state open --json url --jq '.[0].url' 2>/dev/null || true)"
          [ -n "${pr_url}" ] || { echo "ERROR: no PR url found for ${BR}" >&2; exit 31; }

          msg="Created PR for LIVE DEV apply: ${pr_url} (run_id=${RUN_ID})"
          gh issue comment "${ISSUE}" --body "${msg}"
