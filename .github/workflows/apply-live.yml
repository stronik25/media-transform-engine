name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: false
        default: "main"
        type: string
      dry_run:
        description: "If true: validate only (no apply/commit/PR)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  apply_live_dev:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: "live-dev"
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download LIVE DEV artifact from run_id
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ inputs.run_id }}
          path: _live_dev_artifact

      - name: Validate + apply via script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_live_dev.py \
            --artifact-dir "_live_dev_artifact" \
            --run-id "${{ inputs.run_id }}" \
            --issue "${{ inputs.issue }}" \
            --base-branch "${{ inputs.base_branch }}" \
            --dry-run "${{ inputs.dry_run }}"
