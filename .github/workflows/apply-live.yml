name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug run_id that contains artifact live-dev"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact apply_ready
          mkdir -p _live_dev_artifact

          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "live-dev" \
            --dir "_live_dev_artifact"

          echo "Downloaded artifact tree:"
          find _live_dev_artifact -maxdepth 6 -type f -print

      - name: Validate + normalize -> apply_ready/
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          rm -rf apply_ready
          mkdir -p apply_ready/.ai/dev apply_ready/output

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Tree dump:" >&2
            find _live_dev_artifact -maxdepth 8 -type f -print >&2 || true
            exit 11
          fi

          cp -f "${found}" "apply_ready/.ai/dev/${want}"

          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "apply_ready/response.json"; fi

          echo "apply_ready tree (before digest):"
          find apply_ready -maxdepth 6 -type f -print

          # Deterministic digest
          digest_inputs="apply_ready/.ai/dev/${want}"
          [ -f "apply_ready/request.json" ] && digest_inputs="${digest_inputs} apply_ready/request.json"
          [ -f "apply_ready/response.json" ] && digest_inputs="${digest_inputs} apply_ready/response.json"

          digest="$(sha256sum ${digest_inputs} | sha256sum | awk '{print $1}')"
          echo "${digest}" > apply_ready/output/apply_digest.txt
          echo "apply_digest: ${digest}"

          echo "apply_ready tree (final):"
          find apply_ready -maxdepth 6 -type f -print

      - name: Upload apply-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: apply_ready
          if-no-files-found: error
          retention-days: 7

  dry_run_done:
    needs: [validate]
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: echo "dry_run=true -> validation complete"

  apply:
    needs: [validate]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest

    # require approval only when actually applying
    environment: live-apply

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download apply-ready artifact from validate job
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready

      - name: Show apply-ready tree
        shell: bash
        run: |
          set -euo pipefail
          echo "apply_ready tree:"
          find apply_ready -maxdepth 6 -type f -print

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          want="issue_${ISSUE}.md"
          src="apply_ready/.ai/dev/${want}"
          if [ ! -f "${src}" ]; then
            echo "ERROR: expected file missing: ${src}" >&2
            echo "apply_ready tree dump:" >&2
            find apply_ready -maxdepth 8 -type f -print >&2 || true
            exit 31
          fi

          mkdir -p .ai/dev output

          cp -f "${src}" ".ai/dev/${want}"
          cp -f "apply_ready/output/apply_digest.txt" "output/apply_digest.txt"

          # optional traces
          if [ -f "apply_ready/request.json" ]; then cp -f "apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"; fi
          if [ -f "apply_ready/response.json" ]; then cp -f "apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"; fi

          echo "Git status:"
          git status --porcelain

      - name: Create branch + commit + push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="ai-live/issue-${ISSUE}-run-${RUN_ID}"
          git checkout -B "${BR}"

          git add .ai/dev output

          if git diff --cached --quiet; then
            echo "No changes to commit. Exiting."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "BRANCH=${BR}" >> "$GITHUB_ENV"

      - name: Open PR (or reuse existing)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail

          head="${OWNER}:${BRANCH}"
          prs_api="https://api.github.com/repos/${OWNER}/${REPO}/pulls?head=${head}&state=open"
          existing="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${prs_api}")"
          existing_url="$(python3 - <<'PY'
import json,sys,os
a=json.loads(sys.stdin.read() or "[]")
print((a[0].get("html_url","") if a else ""))
PY
<<< "${existing}")"

          if [ -n "${existing_url}" ]; then
            echo "Reusing existing PR: ${existing_url}"
            echo "PR_URL=${existing_url}" >> "$GITHUB_ENV"
            exit 0
          fi

          export TITLE="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          export BODY="Apply LIVE DEV artifact 'live-dev' from AI Debug run ${RUN_ID}. Digest in output/apply_digest.txt."

          payload="$(python3 - <<'PY'
import json,os
print(json.dumps({
  "title": os.environ["TITLE"],
  "head":  os.environ["BRANCH"],
  "base":  os.environ["BASE"],
  "body":  os.environ["BODY"],
}))
PY
)"
          api="https://api.github.com/repos/${OWNER}/${REPO}/pulls"
          resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}")"

          url="$(python3 - <<'PY'
import json,sys
d=json.loads(sys.stdin.read() or "{}")
print(d.get("html_url",""))
PY
<<< "${resp}")"

          if [ -z "${url}" ]; then
            echo "ERROR: PR create failed. Response:" >&2
            echo "${resp}" >&2
            exit 20
          fi

          echo "Opened PR: ${url}"
          echo "PR_URL=${url}" >> "$GITHUB_ENV"

        env:
          BRANCH: ${{ env.BRANCH }}

      - name: Comment back to issue with PR link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          msg="Created/updated PR for LIVE DEV apply: ${PR_URL} (run_id=${RUN_ID})"
          api="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments"
          payload="$(python3 - <<'PY'
import json,os
print(json.dumps({"body": os.environ["MSG"]}))
PY
)"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}" > /dev/null
        env:
          PR_URL: ${{ env.PR_URL }}
          MSG: ${{ format('Created/updated PR for LIVE DEV apply: {0} (run_id={1})', env.PR_URL, inputs.run_id) }}
