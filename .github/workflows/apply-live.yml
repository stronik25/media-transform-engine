name: "Apply LIVE DEV (by run_id)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "AI Debug workflow run_id that contains artifact 'live-dev'"
        required: true
        type: string
      issue:
        description: "Issue number (e.g. 1)"
        required: true
        type: string
      base_branch:
        description: "Base branch (usually main)"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Validate only (no branch/PR)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  ARTIFACT_NAME: "live-dev"
  APPLY_BRANCH_PREFIX: "ai-live/issue-"
  OUTPUT_DIR: "output"

jobs:
  validate:
    runs-on: ubuntu-latest

    # IMPORTANT: only require environment (and any approvals it provides) when actually applying.
    # For dry-run we keep it empty so validation is always allowed.
    environment: ${{ inputs.dry_run && '' || 'live-apply' }}

    concurrency:
      group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
      cancel-in-progress: true

    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      issue: ${{ steps.vars.outputs.issue }}
      run_id: ${{ steps.vars.outputs.run_id }}

    steps:
      - name: Resolve vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          echo "issue=${{ inputs.issue }}" >> "$GITHUB_OUTPUT"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download artifact "live-dev" from AI Debug run (via gh)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ inputs.run_id }}
          NAME: ${{ env.ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          rm -rf _live_dev_artifact _apply_ready "${OUTPUT_DIR}"
          mkdir -p _live_dev_artifact _apply_ready "${OUTPUT_DIR}"

          # downloads and unzips artifact into dir
          gh run download "${RUN_ID}" \
            --repo "${OWNER}/${REPO}" \
            --name "${NAME}" \
            --dir "_live_dev_artifact"

          echo "Downloaded artifact tree:"
          find _live_dev_artifact -maxdepth 4 -type f -print

      - name: Validate + normalize artifact contents (contract)
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p _apply_ready/.ai/dev _apply_ready/output

          want="issue_${ISSUE}.md"
          found="$(find _live_dev_artifact -type f -name "${want}" | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "ERROR: missing ${want} anywhere in artifact" >&2
            echo "Tree:" >&2
            find _live_dev_artifact -maxdepth 8 -type f -print >&2 || true
            exit 11
          fi
          cp -f "${found}" "_apply_ready/.ai/dev/${want}"

          # Optional trace files (copy if exist)
          req="$(find _live_dev_artifact -type f -name "request.json"  | head -n 1 || true)"
          res="$(find _live_dev_artifact -type f -name "response.json" | head -n 1 || true)"
          if [ -n "${req}" ]; then cp -f "${req}" "_apply_ready/request.json"; fi
          if [ -n "${res}" ]; then cp -f "${res}" "_apply_ready/response.json"; fi

          # Make sure at least md exists
          test -f "_apply_ready/.ai/dev/${want}"

          echo "Normalized tree:"
          find _apply_ready -maxdepth 6 -type f -print

      - name: Compute deterministic digest (apply_digest.txt)
        id: digest
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

          want="_apply_ready/.ai/dev/issue_${ISSUE}.md"
          test -f "$want"

          digest_inputs=("$want")
          [ -f "_apply_ready/request.json" ]  && digest_inputs+=("_apply_ready/request.json")
          [ -f "_apply_ready/response.json" ] && digest_inputs+=("_apply_ready/response.json")

          # stable order
          printf "%s\n" "${digest_inputs[@]}" | LC_ALL=C sort > _apply_ready/_digest_list.txt
          digest="$(xargs -a _apply_ready/_digest_list.txt sha256sum | sha256sum | awk '{print $1}')"

          echo "${digest}" > "${OUTPUT_DIR}/apply_digest.txt"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "apply_digest: ${digest}"

      - name: Upload normalized apply-ready artifact (for apply job)
        uses: actions/upload-artifact@v4
        with:
          name: apply-ready
          path: |
            _apply_ready
            output/apply_digest.txt

  dry_run_done:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Dry-run is done
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true -> validation completed; nothing applied."

  apply:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run == false }}

    # if GitHub ever enforces approvals, this is where they'd apply
    environment: live-apply

    concurrency:
      group: apply-live-dev-${{ github.repository }}-${{ inputs.issue }}
      cancel-in-progress: true

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Download normalized artifact from validate job
        uses: actions/download-artifact@v4
        with:
          name: apply-ready
          path: apply_ready_bundle

      - name: Sanity check apply-ready bundle
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          echo "apply_ready tree:"
          find apply_ready_bundle -maxdepth 6 -type f -print

          test -f "apply_ready_bundle/_apply_ready/.ai/dev/issue_${ISSUE}.md"
          test -f "apply_ready_bundle/output/apply_digest.txt"

      - name: Apply artifact into repo working tree
        shell: bash
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          mkdir -p .ai/dev "${OUTPUT_DIR}"

          cp -f "apply_ready_bundle/_apply_ready/.ai/dev/issue_${ISSUE}.md" ".ai/dev/issue_${ISSUE}.md"
          cp -f "apply_ready_bundle/output/apply_digest.txt" "${OUTPUT_DIR}/apply_digest.txt"

          # Optional trace files:
          if [ -f "apply_ready_bundle/_apply_ready/request.json" ]; then
            cp -f "apply_ready_bundle/_apply_ready/request.json" ".ai/dev/request_${ISSUE}.json"
          fi
          if [ -f "apply_ready_bundle/_apply_ready/response.json" ]; then
            cp -f "apply_ready_bundle/_apply_ready/response.json" ".ai/dev/response_${ISSUE}.json"
          fi

          echo "Working tree changes:"
          git status --porcelain

          # Hard guard: ensure something actually changed
          if git diff --quiet; then
            echo "ERROR: apply produced no changes (refusing to proceed)" >&2
            exit 30
          fi

      - name: Create branch + commit + push
        id: push
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail

          BR="${{ env.APPLY_BRANCH_PREFIX }}${ISSUE}-run-${RUN_ID}"
          git checkout -B "${BR}"

          git add .ai/dev "${OUTPUT_DIR}"

          if git diff --cached --quiet; then
            echo "ERROR: nothing staged (refusing to proceed)" >&2
            exit 31
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "apply-live: issue #${ISSUE} from run ${RUN_ID}"
          git push -f origin "${BR}"

          echo "branch=${BR}" >> "$GITHUB_OUTPUT"
          echo "Pushed branch: ${BR}"

      - name: Open PR (or reuse existing)
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail

          title="ai-live: issue #${ISSUE} (run ${RUN_ID})"
          body="Apply LIVE DEV artifact '${{ env.ARTIFACT_NAME }}' from AI Debug run ${RUN_ID}. Digest is in output/apply_digest.txt."

          # Try to find existing open PR for this head
          prs_api="https://api.github.com/repos/${OWNER}/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open"
          prs="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${prs_api}")"
          existing_url="$(python3 - <<'PY'
import json,sys
a=json.loads(sys.stdin.read() or "[]")
print((a[0].get("html_url","") if a else ""))
PY
<<< "${prs}")"

          if [ -n "${existing_url}" ]; then
            echo "Reusing existing PR: ${existing_url}"
            echo "url=${existing_url}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          payload="$(python3 - <<'PY'
import json,os
print(json.dumps({
  "title": os.environ["TITLE"],
  "head": os.environ["HEAD"],
  "base": os.environ["BASE"],
  "body": os.environ["BODY"],
}))
PY
TITLE="${title}" HEAD="${BRANCH}" BASE="${BASE}" BODY="${body}")"

          api="https://api.github.com/repos/${OWNER}/${REPO}/pulls"
          resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}")"

          url="$(python3 - <<'PY'
import json,sys
d=json.loads(sys.stdin.read() or "{}")
print(d.get("html_url",""))
PY
<<< "${resp}")"

          if [ -z "${url}" ]; then
            echo "ERROR: PR create failed. Response:" >&2
            echo "${resp}" >&2
            exit 20
          fi

          echo "Opened PR: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment back to issue with PR link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          msg="Created PR for LIVE DEV apply: ${PR_URL} (run_id=${RUN_ID})"
          api="https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments"

          payload="$(python3 - <<'PY'
import json,os
print(json.dumps({"body": os.environ["MSG"]}))
PY
MSG="${msg}")"

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary "${payload}" \
            "${api}" > /dev/null
